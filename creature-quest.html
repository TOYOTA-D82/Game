<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>怪獸探索 Creature Quest</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
#gameContainer { position: relative; max-width: min(900px, 100vw); width: 100%; margin: 0 auto; }
#gameCanvas { display: block; width: 100%; image-rendering: pixelated; cursor: default; }
/* Title screen */
#titleScreen { position: absolute; top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100; }
#titleScreen h1 { font-size: 3em; color: #ffd700; text-shadow: 0 0 20px #ff8c00, 2px 2px 0 #8b4513; margin-bottom: 0.3em; letter-spacing: 4px; }
#titleScreen h2 { font-size: 1.4em; color: #87ceeb; margin-bottom: 2em; letter-spacing: 2px; }
#titleScreen .emoji-row { font-size: 3em; margin-bottom: 2em; animation: bounce 1s infinite alternate; }
@keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
.btn { background: linear-gradient(135deg,#ffd700,#ff8c00); color: #1a1a2e; border: none; padding: 14px 40px; font-size: 1.2em; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,165,0,0.5); transition: all 0.2s; margin: 6px; }
.btn:hover, .btn:active { transform: scale(1.07); box-shadow: 0 6px 20px rgba(255,165,0,0.8); }
.btn-secondary { background: linear-gradient(135deg,#4a90d9,#2666a0); color: #fff; }
.btn-danger { background: linear-gradient(135deg,#e55,#a22); color: #fff; }
.btn-green { background: linear-gradient(135deg,#4a9,#276); color: #fff; }
/* Starter select */
#starterScreen { position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,10,30,0.97);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99; }
#starterScreen h2 { color:#ffd700;font-size:1.8em;margin-bottom:0.5em; }
#starterScreen p { color:#aaa;margin-bottom:1.5em; }
#starterCards { display:flex;gap:20px;flex-wrap:wrap;justify-content:center; }
.starterCard { background:linear-gradient(135deg,#1e2a4a,#2a3a6a);border:2px solid #4a6;border-radius:16px;padding:20px;width:170px;cursor:pointer;transition:all 0.2s;text-align:center; }
.starterCard:hover { transform:scale(1.07);border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,0.4); }
.starterCard .emoji { font-size:3em;display:block;margin-bottom:10px; }
.starterCard .sname { color:#ffd700;font-size:1.2em;font-weight:bold; }
.starterCard .stype { color:#87ceeb;font-size:0.9em;margin:4px 0; }
.starterCard .sdesc { color:#aaa;font-size:0.8em;line-height:1.4; }
/* Party screen overlay */
#partyScreen { position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:98; }
#partyScreen h2 { color:#ffd700;font-size:1.5em;margin-bottom:1em; }
#partyGrid { display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:500px;width:90%; }
.partySlot { background:linear-gradient(135deg,#1e2a4a,#2a3a6a);border:2px solid #445;border-radius:12px;padding:14px;min-height:80px; }
.partySlot.filled { border-color:#4a9; }
.partySlot .slot-emoji { font-size:2em; }
.partySlot .slot-name { color:#ffd700;font-size:0.95em;font-weight:bold; }
.partySlot .slot-level { color:#aaa;font-size:0.8em; }
.slot-hp-bar { height:8px;background:#333;border-radius:4px;margin-top:6px;overflow:hidden; }
.slot-hp-fill { height:100%;border-radius:4px;transition:width 0.3s; }
/* Battle UI */
#battleUI { position:absolute;bottom:0;left:0;width:100%;display:none;flex-direction:column;z-index:50;pointer-events:all; }
#battleActions { background:rgba(20,20,40,0.97);border-top:2px solid #334;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px; }
#battleActions button { min-height:54px;padding:8px 6px;font-size:1.05em;border-radius:12px;border:none;cursor:pointer;font-weight:bold;transition:all 0.15s;touch-action:manipulation; }
#battleActions button:active { transform:scale(0.95); }
#battleMoves { background:rgba(20,20,40,0.97);border-top:2px solid #334;padding:10px 12px;display:none;grid-template-columns:1fr 1fr;gap:8px; }
#battleMoves button { min-height:50px;padding:8px 6px;font-size:0.95em;border-radius:12px;border:none;cursor:pointer;font-weight:bold;transition:all 0.15s;touch-action:manipulation; }
#battleMoves button:active { transform:scale(0.95); }
#msgLog { background:rgba(10,10,25,0.97);color:#e8e0ff;padding:10px 16px;min-height:52px;font-size:1em;border-top:1px solid #334;cursor:pointer;line-height:1.55;user-select:none; }
#msgLog .tap-hint { color:#445;font-size:0.8em; }
#msgTimer { height:3px;background:#334;overflow:hidden; }
#msgTimerBar { height:100%;background:#4466cc;width:100%;transition:width linear; }
#battleActions small, #battleMoves small { opacity:0.45;font-size:0.7em;font-weight:normal;margin-left:3px; }
@media (pointer:coarse) { #battleActions small, #battleMoves small { display:none; } }
/* Battle cursor highlight */
#battleActions button.cursor-on, #battleMoves button.cursor-on { outline:3px solid #ffd700 !important; box-shadow:0 0 12px rgba(255,215,0,0.7) !important; transform:scale(1.06) !important; }
/* Zone / NPC / Victory */
#zoneOverlay { position:absolute;top:0;left:0;width:100%;height:100%;background:#000;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.35s; }
#zoneBanner { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.88);color:#ffd700;font-size:1.25em;font-weight:bold;padding:12px 28px;border-radius:14px;border:2px solid #ffd700;z-index:210;opacity:0;pointer-events:none;transition:opacity 0.4s;white-space:nowrap;text-align:center; }
#trainerDialog { position:absolute;bottom:0;left:0;width:100%;background:rgba(8,4,24,0.97);border-top:2px solid #ffd700;padding:14px 18px;display:none;flex-direction:column;align-items:center;z-index:110; }
#trainerDialogEmoji { font-size:2.8em;margin-bottom:6px; }
#trainerDialogName { color:#ffd700;font-weight:bold;font-size:1.1em;margin-bottom:6px; }
#trainerDialogText { color:#ccc;font-size:0.88em;margin-bottom:14px;text-align:center;line-height:1.6;white-space:pre-line; }
#victoryScreen { position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a0a00,#2a1400,#080820);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:125;text-align:center;padding:20px; }
#victoryScreen h1 { color:#ffd700;font-size:2.2em;text-shadow:0 0 20px #ff8800;margin:14px 0; }
#victoryScreen p { color:#ddd;max-width:340px;line-height:1.8;font-size:0.95em;margin-bottom:20px;white-space:pre-line; }
#victoryBadges { font-size:2.2em;letter-spacing:8px;margin-bottom:20px; }
/* HUD */
#hud { position:absolute;top:0;left:0;width:100%;background:rgba(10,10,25,0.85);border-bottom:2px solid #334;padding:6px 10px;display:flex;align-items:center;gap:12px;z-index:30;pointer-events:none; }
#hudParty { display:flex;gap:6px; }
.hud-mon { font-size:1.4em;position:relative;display:inline-block;margin-right:2px; }
.hud-mon .hud-hp { position:absolute;bottom:-3px;left:0;right:0;height:3px;background:#333;border-radius:2px;overflow:hidden; }
.hud-mon .hud-hp-fill { height:100%;border-radius:2px; }
#hudItems { margin-left:auto;color:#ffd700;font-size:0.95em;display:flex;gap:16px; }
#hudItems span { color:#ccc; }
/* Virtual D-pad */
#dpad { position:absolute;bottom:10px;left:10px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:3px;z-index:60;pointer-events:all; }
#dpad button { background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);color:#fff;font-size:1.4em;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;transition:background 0.1s; }
#dpad button:active { background:rgba(255,255,255,0.45); }
#dpad .empty { background:none;border:none; }
/* Menu button */
#menuBtn { position:absolute;top:8px;right:10px;z-index:60;pointer-events:all; }
/* Save indicator */
#saveIndicator { position:absolute;top:40px;right:10px;color:#4af;font-size:0.8em;opacity:0;transition:opacity 0.5s;z-index:60; }
/* Type colors for move buttons */
.type-fire { background:linear-gradient(135deg,#e55,#c30) !important;color:#fff !important; }
.type-water { background:linear-gradient(135deg,#48f,#259) !important;color:#fff !important; }
.type-grass { background:linear-gradient(135deg,#4a9,#276) !important;color:#fff !important; }
.type-electric { background:linear-gradient(135deg,#fd2,#a80) !important;color:#333 !important; }
.type-dark { background:linear-gradient(135deg,#669,#335) !important;color:#fff !important; }
.type-rock { background:linear-gradient(135deg,#986,#654) !important;color:#fff !important; }
.type-normal { background:linear-gradient(135deg,#aaa,#777) !important;color:#fff !important; }
/* Evolution screen */
#evolutionScreen { position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:97;text-align:center; }
#evolutionScreen .evo-emoji { font-size:6em;animation:evoSpin 0.5s infinite alternate; }
@keyframes evoSpin { from{transform:scale(1) rotate(-5deg)} to{transform:scale(1.2) rotate(5deg)} }
#evolutionScreen h2 { color:#ffd700;font-size:2em;margin:20px 0; }
#evolutionScreen p { color:#ccc;font-size:1.1em; }
/* Rarity */
.r-badge { display:inline-block;padding:1px 7px;border-radius:5px;font-size:0.7em;font-weight:bold;margin-left:4px;vertical-align:middle; }
.r-common { background:#333;color:#aaa; }
.r-uncommon { background:#1a4a1a;color:#44cc44; }
.r-rare { background:#1a2a4a;color:#6699ff; }
.r-epic { background:#2a1a4a;color:#bb66ff; }
.r-legendary { background:#3a2800;color:#ffcc00; }
.r-limited { background:#3a001a;color:#ff66cc; }
/* Story dialog */
#storyDialog { position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:115; }
#storyBox { background:linear-gradient(135deg,#0d1528,#1a2545);border:2px solid #ffd700;border-radius:18px;padding:28px 22px;max-width:480px;width:90%;text-align:center; }
#storyChapter { color:#ffd700;font-size:1.15em;font-weight:bold;margin-bottom:14px;letter-spacing:1px; }
#storyText { color:#c8d0ff;font-size:0.88em;line-height:1.85;margin-bottom:14px;white-space:pre-line;text-align:left; }
#storyReward { background:rgba(68,200,140,0.12);border:1px solid #44cc88;border-radius:8px;padding:8px 12px;color:#44ffaa;font-size:0.85em;margin-bottom:16px; }
/* Quest HUD strip */
#questHud { position:absolute;top:46px;left:0;right:0;background:rgba(8,8,22,0.88);border-bottom:1px solid #2a2a44;padding:4px 12px;z-index:28;pointer-events:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
.qh-label { color:#ffd700;font-size:0.7em;font-weight:bold;white-space:nowrap; }
.qh-name { color:#e0e0ff;font-size:0.7em;white-space:nowrap; }
.qh-sep { color:#444;font-size:0.7em; }
.qh-desc { color:#888;font-size:0.7em;flex:1; }
.qh-prog { color:#44aaff;font-size:0.7em;white-space:nowrap; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="540"></canvas>

  <!-- Title Screen -->
  <div id="titleScreen">
    <div class="emoji-row">&#x1F98A; &#x1F41F; &#x1F331;</div>
    <h1>怪獸探索</h1>
    <h2>Creature Quest</h2>
    <button class="btn" id="btnNewGame">開始遊戲</button>
    <button class="btn btn-secondary" id="btnLoadGame">載入存檔</button>
  </div>

  <!-- Starter Select -->
  <div id="starterScreen">
    <h2>選擇你的夥伴！</h2>
    <p>選擇你的初始怪獸，踏上冒險之旅</p>
    <div id="starterCards"></div>
  </div>

  <!-- Party Screen -->
  <div id="partyScreen">
    <h2>&#x1F3D2; 我的隊伍</h2>
    <div id="partyGrid"></div>
    <button class="btn btn-secondary" id="btnCloseParty" style="margin-top:16px">關閉</button>
  </div>

  <!-- Evolution Screen -->
  <div id="evolutionScreen">
    <div class="evo-emoji" id="evoEmoji"></div>
    <h2 id="evoTitle"></h2>
    <p id="evoDesc"></p>
    <button class="btn" id="btnCloseEvolution" style="margin-top:20px">繼續！</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="hudParty"></div>
    <div id="hudItems">
      <span>&#x26BD; <span id="hudBalls">0</span></span>
      <span>&#x1F48A; <span id="hudPotions">0</span></span>
      <span id="hudBadges" style="letter-spacing:2px;font-size:0.9em"></span>
    </div>
  </div>

  <!-- Battle UI -->
  <div id="battleUI">
    <div id="battleActions">
      <button class="btn type-normal" id="btnFight">&#x2694;&#xFE0F; 戰鬥 <small>[1]</small></button>
      <button class="btn type-water" id="btnBall">&#x26BD; 捕捉球 <small>[2]</small></button>
      <button class="btn type-grass" id="btnPotion">&#x1F48A; 藥水 <small>[3]</small></button>
      <button class="btn type-dark" id="btnRun">&#x1F3C3; 逃跑 <small>[4]</small></button>
    </div>
    <div id="battleMoves"></div>
    <div id="msgTimer"><div id="msgTimerBar"></div></div>
    <div id="msgLog">
      <span id="msgText">...</span>
      <span class="tap-hint" id="tapHint"></span>
    </div>
  </div>

  <!-- Virtual D-pad -->
  <div id="dpad">
    <button class="empty" disabled></button>
    <button id="dpadUp">&#x25B2;</button>
    <button class="empty" disabled></button>
    <button id="dpadLeft">&#x25C4;</button>
    <button class="empty" disabled></button>
    <button id="dpadRight">&#x25BA;</button>
    <button class="empty" disabled></button>
    <button id="dpadDown">&#x25BC;</button>
    <button class="empty" disabled></button>
  </div>

  <!-- Menu Button -->
  <div id="menuBtn">
    <button class="btn btn-secondary" style="padding:8px 14px;font-size:0.85em" id="btnParty">&#x1F3D2; 隊伍</button>
    <button class="btn" style="padding:8px 14px;font-size:0.85em" id="btnSave">&#x1F4BE; 存檔</button>
  </div>

  <div id="saveIndicator">已存檔！</div>

  <!-- Zone transition -->
  <div id="zoneOverlay"></div>
  <div id="zoneBanner"></div>

  <!-- Trainer pre-battle dialog -->
  <div id="trainerDialog">
    <div id="trainerDialogEmoji"></div>
    <div id="trainerDialogName"></div>
    <div id="trainerDialogText"></div>
    <button class="btn" id="btnTrainerFight">應戰！</button>
  </div>

  <!-- Victory screen -->
  <div id="victoryScreen">
    <div style="font-size:5em">🏆</div>
    <h1>怪獸大師誕生！</h1>
    <p id="victoryText"></p>
    <div id="victoryBadges"></div>
    <button class="btn" id="btnVictoryOk">繼續探索世界</button>
  </div>

  <!-- Story / Quest Dialog -->
  <div id="storyDialog">
    <div id="storyBox">
      <div id="storyChapter">&#x1F4D6; 故事開始</div>
      <div id="storyText"></div>
      <div id="storyReward"></div>
      <button class="btn" id="btnStoryOk">&#x1F680; 繼續冒險！</button>
    </div>
  </div>

  <!-- Quest HUD strip (shown below main HUD) -->
  <div id="questHud" style="display:none">
    <span class="qh-label">&#x1F4CB; 任務:</span>
    <span class="qh-name" id="questHudName"></span>
    <span class="qh-sep">|</span>
    <span class="qh-desc" id="questHudDesc"></span>
    <span class="qh-prog" id="questHudProg"></span>
  </div>
</div>

<script>
(function() {
'use strict';

// ==================== CONSTANTS ====================
var TILE = 40;
var MAP_W = 30, MAP_H = 24;
var CANVAS_W = 900, CANVAS_H = 540;

// Tile types
var T_PATH = 0, T_GRASS = 1, T_TREE = 2, T_WATER = 3, T_TOWN = 4, T_FLOWER = 5, T_BUILDING = 6,
    T_DEEPGRASS = 7, T_ROCK = 8, T_SAND = 9, T_WARP = 10;

// Tile colors
var TILE_COLORS = {};
TILE_COLORS[T_PATH]      = '#d4b870';
TILE_COLORS[T_GRASS]     = '#3a8020';
TILE_COLORS[T_TREE]      = '#1a5c10';
TILE_COLORS[T_WATER]     = '#2878d0';
TILE_COLORS[T_TOWN]      = '#f0d090';
TILE_COLORS[T_FLOWER]    = '#f0a820';
TILE_COLORS[T_BUILDING]  = '#6b3a1f';
TILE_COLORS[T_DEEPGRASS] = '#245814';
TILE_COLORS[T_ROCK]      = '#8a8278';
TILE_COLORS[T_SAND]      = '#e6d29a';
TILE_COLORS[T_WARP]      = '#7733cc';

// ==================== ZONE CONFIGS ====================
var ZONE_CONFIG = {
  start: {
    title:'翠綠草原', bgColor:'#1a1a2e',
    tileOverride:{},
    warps:[ {x:29,y:13,toZone:'cave',toX:1,toY:13}, {x:29,y:14,toZone:'cave',toX:1,toY:14} ]
  },
  cave: {
    title:'岩石洞窟', bgColor:'#060408',
    tileOverride:{ 1:'#1e2818', 0:'#181412', 5:'#162614', 7:'#1e2818' },
    waterColor:'#0a1a3a',
    warps:[
      {x:0,y:13,toZone:'start',toX:28,toY:13}, {x:0,y:14,toZone:'start',toX:28,toY:14},
      {x:14,y:23,toZone:'volcano',toX:14,toY:1}, {x:15,y:23,toZone:'volcano',toX:15,toY:1}
    ],
    encounterZone:'cave', levelRange:[16,26]
  },
  volcano: {
    title:'炎火山道', bgColor:'#1e0400',
    tileOverride:{ 1:'#3a1808', 0:'#2a1206', 7:'#3a1808' },
    waterColor:'#cc4400',
    warps:[ {x:14,y:0,toZone:'cave',toX:14,toY:22}, {x:15,y:0,toZone:'cave',toX:15,toY:22} ],
    encounterZone:'volcano', levelRange:[24,36]
  }
};

// ==================== TRAINER DEFS ====================
var TRAINER_DEFS = {
  trainer_grass: {
    zone:'start', tx:22, ty:13, emoji:'\u{1F33F}',
    name:'草原道館主·翠兒',
    title:'草原道館主', badge:'翠葉徽章', badgeEmoji:'\u{1F343}',
    preDialog:'我是草原道館主翠兒！\n你的怪獸够強壯嗎？',
    winDialog:'太厉害了！你約得了翠葉徽章！\n地圖右侧有洞窟入口，前進吧！',
    teamSpec:[{id:'thornback',lv:14},{id:'bloomira',lv:16}], requiredBadges:0
  },
  trainer_dark: {
    zone:'start', tx:14, ty:22, emoji:'\u{1F311}',
    name:'深林道館主·影月',
    title:'深林道館主', badge:'暗影徽章', badgeEmoji:'\u{1F311}',
    preDialog:'黑暗之中，只有強者才能生存…\n你能挑戰我嗎？',
    winDialog:'驚人！收下暗影徽章！\n前往右遙的洞窟，再深入炎火山道吧！',
    teamSpec:[{id:'gloomfang',lv:20},{id:'shadowpup',lv:18},{id:'voidwing',lv:22}], requiredBadges:1
  },
  trainer_rock: {
    zone:'cave', tx:14, ty:12, emoji:'⛰',
    name:'洞窟道館主·石剛',
    title:'洞窟道館主', badge:'磐石徽章', badgeEmoji:'\u{1FAA8}',
    preDialog:'這洞窟是我的地盤！\n磐石徽章可不是輕易能拿的！',
    winDialog:'你突破了磐石防線！\n磐石徽章是你的！往南前往炎火山道！',
    teamSpec:[{id:'stoneback',lv:24},{id:'pebblor',lv:22},{id:'volthorn',lv:25}], requiredBadges:2
  },
  trainer_final: {
    zone:'volcano', tx:14, ty:10, emoji:'\u{1F451}',
    name:'炎皇大師·焰王',
    title:'最終魔王', badge:'怪獸大師', badgeEmoji:'\u{1F3C6}',
    isFinalBoss:true,
    preDialog:'哼…你真的走到這裡了。\n我是最後的考驗，\n準備好迎接最終試煉！',
    winDialog:'…不可能！\n你確實是真正的怪獸大師！\n整個大陸都會銅記你的名字！',
    teamSpec:[{id:'infernus',lv:32},{id:'abysal',lv:30},{id:'lumindra',lv:35}], requiredBadges:3
  }
};

// ==================== MAP GENERATION ====================
// Deterministic hash (0..1) so terrain is identical every reload (map isn't saved).
function tileHash(r, c) {
  var n = Math.sin(r * 127.1 + c * 311.7) * 43758.5453;
  return n - Math.floor(n);
}
// Pond bodies of water in the route zone
function inPond(r, c) {
  if (r>=11 && r<=13 && c>=3 && c<=6) return true;   // west pond
  if (r>=15 && r<=17 && c>=22 && c<=25) return true; // east pond
  return false;
}
function nearPond(r, c) {
  var dr, dc;
  for (dr=-1; dr<=1; dr++) for (dc=-1; dc<=1; dc++) {
    if (inPond(r+dr, c+dc)) return true;
  }
  return false;
}

function generateMap() {
  var map = [];
  var r, c;
  for (r = 0; r < MAP_H; r++) {
    map.push([]);
    for (c = 0; c < MAP_W; c++) {
      var tile;
      var corridor = (c >= 13 && c <= 16); // central walkable corridor, always clear
      // Border = trees
      if (r===0 || r===MAP_H-1 || c===0 || c===MAP_W-1) {
        tile = T_TREE;
      }
      // Town rows 1-7
      else if (r >= 1 && r <= 7) {
        if (c===14 || c===15) {
          tile = T_TOWN;
        } else if ((r>=2&&r<=5&&c>=3&&c<=8) || (r>=2&&r<=5&&c>=20&&c<=25)) {
          tile = T_BUILDING;
        } else if (r>=2&&r<=3&&c>=17&&c<=18) {
          tile = T_WATER; // town fountain
        } else if ((r>=2&&r<=4&&c>=10&&c<=12) || (r>=5&&r<=7&&c>=5&&c<=7)) {
          tile = T_FLOWER;
        } else {
          tile = T_TOWN;
        }
      }
      // Gate row 8
      else if (r === 8) {
        tile = corridor ? T_PATH : T_TREE;
      }
      // Route rows 9-19 — grassland with ponds, flowers, rocks, scattered trees
      else if (r >= 9 && r <= 19) {
        if (corridor) tile = T_PATH;
        else if (c<1 || c>28) tile = T_TREE;
        else if (inPond(r, c)) tile = T_WATER;
        else if (nearPond(r, c)) tile = T_SAND;
        else {
          var hp = tileHash(r, c);
          if (hp < 0.06) tile = T_TREE;
          else if (hp < 0.10) tile = T_ROCK;
          else if (hp < 0.18) tile = T_FLOWER;
          else tile = T_GRASS;
        }
      }
      // Deep Forest rows 20-22 — dark dense grass with clustered trees & rocks
      else if (r >= 20) {
        if (r === 20 && corridor) {
          tile = T_DEEPGRASS; // clean entry from the route
        } else {
          var hf = tileHash(r, c);
          if (!corridor && hf < 0.16) tile = T_TREE;
          else if (!corridor && hf < 0.21) tile = T_ROCK;
          else tile = T_DEEPGRASS;
        }
      } else {
        tile = T_PATH;
      }
      // East passage (rows 13-14): a clear dirt road from the central corridor
      // out to the cave portal so the player can always reach it.
      if ((r === 13 || r === 14) && c >= 16 && c <= 28) tile = T_PATH;
      // Cave portals on the east border
      if ((r === 13 || r === 14) && c === MAP_W - 1) tile = T_WARP;
      map[r].push(tile);
    }
  }
  return map;
}

function generateCaveMap() {
  var map = [], r, c, hv, wi, wl = ZONE_CONFIG.cave.warps;
  for (r = 0; r < MAP_H; r++) {
    map.push([]);
    for (c = 0; c < MAP_W; c++) {
      // Border: warp exits or solid rock
      if (r === 0 || r === MAP_H-1 || c === 0 || c === MAP_W-1) {
        var isW = false; for (wi=0;wi<wl.length;wi++) { if (wl[wi].x===c&&wl[wi].y===r){isW=true;break;} }
        map[r].push(isW ? T_WARP : T_TREE); continue;
      }
      if (c >= 13 && c <= 16) { map[r].push(T_PATH); continue; } // central corridor
      // Guaranteed clear lane from the west portal (rows 13-14) to the corridor
      if ((r === 13 || r === 14) && c >= 1 && c <= 12) { map[r].push(T_PATH); continue; }
      // Cross-corridor rows
      if ((r >= 10 && r <= 14) || (r >= 4 && r <= 6) || (r >= 17 && r <= 19)) {
        if (c >= 1 && c <= 28) {
          hv = tileHash(r, c);
          if (hv < 0.14) { map[r].push(T_ROCK); continue; }
          if (hv < 0.22) { map[r].push(T_WATER); continue; }
          map[r].push(T_GRASS); continue;
        }
      }
      // Chambers
      if (((r>=2&&r<=8&&c>=2&&c<=11)||(r>=2&&r<=8&&c>=18&&c<=27)||
           (r>=15&&r<=21&&c>=2&&c<=11)||(r>=15&&r<=21&&c>=18&&c<=27))) {
        hv = tileHash(r+100, c);
        if (hv < 0.20) { map[r].push(T_ROCK); continue; }
        if (hv < 0.28) { map[r].push(T_WATER); continue; }
        if (hv < 0.35) { map[r].push(T_FLOWER); continue; }
        map[r].push(T_GRASS); continue;
      }
      map[r].push(T_TREE); // solid cave wall
    }
  }
  return map;
}

function generateVolcanoMap() {
  var map = [], r, c, hv, wi, wl = ZONE_CONFIG.volcano.warps;
  for (r = 0; r < MAP_H; r++) {
    map.push([]);
    for (c = 0; c < MAP_W; c++) {
      if (r === 0 || r === MAP_H-1 || c === 0 || c === MAP_W-1) {
        var isW2 = false; for (wi=0;wi<wl.length;wi++) { if (wl[wi].x===c&&wl[wi].y===r){isW2=true;break;} }
        map[r].push(isW2 ? T_WARP : T_TREE); continue;
      }
      if (c >= 13 && c <= 16) { map[r].push(T_PATH); continue; }
      // Lava rivers (T_WATER, rendered orange in volcano zone)
      if ((r>=5&&r<=7&&c>=1&&c<=12)||(r>=15&&r<=17&&c>=17&&c<=28)||
          (r>=10&&r<=11&&c>=1&&c<=6)||(r>=12&&r<=13&&c>=22&&c<=28)) {
        map[r].push(T_WATER); continue;
      }
      hv = tileHash(r+500, c);
      if (hv < 0.12) { map[r].push(T_ROCK); continue; }
      if (hv < 0.20) { map[r].push(T_FLOWER); continue; } // fire patches (rendered red)
      if (hv < 0.24) { map[r].push(T_WATER); continue; } // lava pool
      map[r].push(T_GRASS); // scorched ash ground
    }
  }
  return map;
}

function getOrCreateZoneMap(zone) {
  if (!state.zoneMaps[zone]) {
    if (zone === 'cave')         state.zoneMaps[zone] = generateCaveMap();
    else if (zone === 'volcano') state.zoneMaps[zone] = generateVolcanoMap();
    else                         state.zoneMaps[zone] = generateMap();
  }
  return state.zoneMaps[zone];
}

function enterZone(zoneName, toX, toY) {
  state.currentZone = zoneName;
  state.map = getOrCreateZoneMap(zoneName);
  state.player.x = toX; state.player.y = toY;
  updateCamera();
  var cfg = ZONE_CONFIG[zoneName] || {};
  var banner = document.getElementById('zoneBanner');
  var overlay = document.getElementById('zoneOverlay');
  if (overlay) { overlay.style.opacity='1'; setTimeout(function(){overlay.style.opacity='0';},320); }
  if (banner && cfg.title) {
    banner.textContent = cfg.title;
    banner.style.opacity = '1';
    setTimeout(function(){ banner.style.opacity = '0'; }, 1800);
  }
  // Update body background to match zone feel
  document.body.style.background = cfg.bgColor || '#1a1a2e';
}

// ==================== CREATURE FACTORY ====================
function calcStats(speciesId, level) {
  var sp = SPECIES[speciesId];
  var scale = 1 + (level - 1) * 0.05;
  return {
    maxHP: Math.floor(sp.hp * scale),   // removed +level*2 that bloated low-level HP
    atk:   Math.floor(sp.atk * scale),
    def:   Math.floor(sp.def * scale),
    spd:   Math.floor(sp.spd * scale)
  };
}

function getMoves(speciesId, level) {
  var sp = SPECIES[speciesId];
  var known = [];
  var i;
  for (i = 0; i < sp.moves.length; i++) {
    if (sp.moves[i].lv <= level) known.push(sp.moves[i].id);
  }
  return known.slice(-4);
}

function createCreature(speciesId, level) {
  var sp = SPECIES[speciesId];
  var stats = calcStats(speciesId, level);
  var moves = getMoves(speciesId, level);
  return {
    speciesId: speciesId,
    name: sp.name,
    emoji: sp.emoji,
    type: sp.type,
    rarity: SPECIES_RARITY[speciesId] || 'common',
    shiny: false,
    level: level,
    exp: 0,
    expNeeded: level * level * 5,
    hp: stats.maxHP,
    maxHP: stats.maxHP,
    atk: stats.atk,
    def: stats.def,
    spd: stats.spd,
    atkMod: 0,
    moves: moves
  };
}

function pickEncounter(zone) {
  var table = ENCOUNTERS[zone];
  var total = 0, i;
  for (i = 0; i < table.length; i++) total += table[i].w;
  var r = Math.random() * total;
  for (i = 0; i < table.length; i++) { r -= table[i].w; if (r <= 0) return table[i].id; }
  return table[0].id;
}

function getTypeEff(atkType, defType) {
  if (TYPE_EFF[atkType] && TYPE_EFF[atkType][defType]) return TYPE_EFF[atkType][defType];
  return 1;
}

// ==================== SHINY / RARE SPAWNS ====================
// Make a wild creature, factoring in shiny (異色) odds and rare legendary spawns.
function rollShiny(c) {
  if (Math.random() < 1/150) {
    c.shiny = true;
    c.name = '✨' + c.name; // sparkle prefix
    c.maxHP = Math.floor(c.maxHP * 1.15);
    c.hp = c.maxHP;
    c.atk = Math.floor(c.atk * 1.15);
    c.def = Math.floor(c.def * 1.15);
    c.spd = Math.floor(c.spd * 1.15);
  }
  return c;
}

function createWildCreature(zone, level) {
  // Deep forest can rarely spawn a legendary (4% chance)
  if (zone === 'forest' && Math.random() < 0.04) {
    var legs = ['lumindra', 'voidwing'];
    var legId = legs[Math.floor(Math.random() * legs.length)];
    var legLevel = 25 + Math.floor(Math.random() * 11); // Lv.25-35
    return rollShiny(createCreature(legId, legLevel));
  }
  var speciesId = pickEncounter(zone);
  return rollShiny(createCreature(speciesId, level));
}

// ==================== QUEST SYSTEM ====================
function advanceQuest(type, value) {
  var qs = state.quests;
  if (!qs || qs.activeIdx >= QUESTS.length) return;
  var q = QUESTS[qs.activeIdx];
  if (q.type !== type) return;

  if (type === 'level_reach') {
    if ((value || 0) >= q.target) completeQuest(q);
  } else {
    qs.progress[type] = (qs.progress[type] || 0) + 1;
    if (qs.progress[type] >= q.target) completeQuest(q);
  }
}

function completeQuest(q) {
  var qs = state.quests;
  qs.completed.push(q.id);
  qs.activeIdx++;
  if (q.reward.balls)   state.items.balls   += q.reward.balls;
  if (q.reward.potions) state.items.potions += q.reward.potions;
  updateHUD();
  if (state.phase === 'battle') {
    state.pendingQuests.push(q);
  } else {
    showStoryDialog(q);
  }
}

function flushPendingQuests() {
  if (state.pendingQuests && state.pendingQuests.length > 0) {
    var q = state.pendingQuests.shift();
    showStoryDialog(q);
    return true;
  }
  return false;
}

}

function showStoryDialog(q) {
  document.getElementById('storyChapter').textContent = '\u{1F4D6} ' + q.chapter + '：' + q.title + ' 完成！';
  document.getElementById('storyText').textContent = q.story;

  rew.textContent = '\u{1F381} ' + q.rewardText;
  document.getElementById('storyDialog').style.display = 'flex';
  state.phase = 'story';

  document.getElementById('questHud').style.display = 'none';

function closeStoryDialog() {
  document.getElementById('storyDialog').style.display = 'none';
  document.getElementById('storyReward').style.display = 'block';
  // If more quests completed at once, show the next story beat
  if (flushPendingQuests()) return;
  state.phase = 'world';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('dpad').style.display = 'grid';
  document.getElementById('menuBtn').style.display = 'block';
  updateQuestHUD();
  updateHUD();
  saveGame();
}

function updateQuestHUD() {
  var qs = state.quests;
  var qEl = document.getElementById('questHud');
  // Never show the quest strip while a battle overlay is active
  if (state.phase === 'battle') { qEl.style.display = 'none'; return; }
  if (!qs || qs.activeIdx >= QUESTS.length) { qEl.style.display = 'none'; return; }
  var q = QUESTS[qs.activeIdx];
  qEl.style.display = 'flex';
  document.getElementById('questHudName').textContent = q.chapter + ' - ' + q.title;
  document.getElementById('questHudDesc').textContent = q.desc;
  var prog = qs.progress[q.type] || 0;
  document.getElementById('questHudProg').textContent = q.target > 1 ? (prog + '/' + q.target) : '';
}

// ==================== XP / LEVEL UP ====================
function gainExp(creature, amount) {
  creature.exp += amount;
  var evolutions = [];
  while (creature.exp >= creature.expNeeded) {
    creature.exp -= creature.expNeeded;
    creature.level++;
    creature.expNeeded = creature.level * creature.level * 5;
    var stats = calcStats(creature.speciesId, creature.level);
    var hpGain = stats.maxHP - creature.maxHP;
    creature.maxHP = stats.maxHP;
    creature.hp = Math.min(creature.hp + hpGain, creature.maxHP);
    creature.atk = stats.atk;
    creature.def = stats.def;
    creature.spd = stats.spd;
    // Learn new moves
    var sp = SPECIES[creature.speciesId];
    var i;
    for (i = 0; i < sp.moves.length; i++) {
      var m = sp.moves[i];
      if (m.lv === creature.level && creature.moves.indexOf(m.id) === -1) {
        creature.moves.push(m.id);
        if (creature.moves.length > 4) creature.moves.shift();
        addMsg(creature.name + ' 學會了 ' + MOVES[m.id].name + '！');
      }
    }
    // Check evolution
    var evo = SPECIES[creature.speciesId].evo;
    if (evo && creature.level >= evo.lv) {
      evolutions.push({ creature: creature, to: evo.to });
    }
  }
  return evolutions;
}

// ==================== CANVAS RENDERING ====================
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');

function updateCamera() {
  var cx = state.player.x * TILE - CANVAS_W/2 + TILE/2;
  var cy = state.player.y * TILE - CANVAS_H/2 + TILE/2;
  state.camera.x = Math.max(0, Math.min(cx, MAP_W*TILE - CANVAS_W));
  state.camera.y = Math.max(0, Math.min(cy, MAP_H*TILE - CANVAS_H));
}

function roundRect(cx2d, x, y, w, h, rad) {
  cx2d.beginPath();
  cx2d.moveTo(x+rad, y);
  cx2d.lineTo(x+w-rad, y);
  cx2d.quadraticCurveTo(x+w, y, x+w, y+rad);
  cx2d.lineTo(x+w, y+h-rad);
  cx2d.quadraticCurveTo(x+w, y+h, x+w-rad, y+h);
  cx2d.lineTo(x+rad, y+h);
  cx2d.quadraticCurveTo(x, y+h, x, y+h-rad);
  cx2d.lineTo(x, y+rad);
  cx2d.quadraticCurveTo(x, y, x+rad, y);
  cx2d.closePath();
}

var worldAnim = 0;
function drawWorld() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  worldAnim++;
  var camX = state.camera.x, camY = state.camera.y;
  var startC = Math.floor(camX / TILE);
  var startR = Math.floor(camY / TILE);
  var endC = Math.min(startC + Math.ceil(CANVAS_W/TILE) + 1, MAP_W);
  var endR = Math.min(startR + Math.ceil(CANVAS_H/TILE) + 1, MAP_H);
  var r, c, tile, x, y;
  var zCfg = ZONE_CONFIG[state.currentZone] || {};
  var tOver = zCfg.tileOverride || {};

  for (r = startR; r < endR; r++) {
    for (c = startC; c < endC; c++) {
      tile = state.map[r][c];
      x = c * TILE - camX;
      y = r * TILE - camY;
      ctx.fillStyle = tOver[tile] || TILE_COLORS[tile] || '#888';
      ctx.fillRect(x, y, TILE, TILE);

      if (tile === T_GRASS) {
        ctx.fillStyle = '#2a6016';
        ctx.fillRect(x+5, y+12, 3, 16);
        ctx.fillRect(x+14, y+8, 3, 20);
        ctx.fillRect(x+24, y+14, 3, 14);
        ctx.fillStyle = '#4aaa28';
        ctx.fillRect(x+6, y+8, 2, 8);
        ctx.fillRect(x+16, y+4, 2, 8);
        ctx.fillRect(x+26, y+10, 2, 8);
      } else if (tile === T_TREE) {
        ctx.fillStyle = '#0d3a08';
        ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
        ctx.fillStyle = '#1e6614';
        ctx.fillRect(x+6, y+6, TILE-12, TILE-12);
        ctx.fillStyle = '#2a8c1a';
        ctx.fillRect(x+10, y+10, TILE-20, TILE-20);
      } else if (tile === T_FLOWER) {
        ctx.fillStyle = '#e8cc88';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#ff88aa';
        ctx.fillRect(x+8, y+8, 8, 8);
        ctx.fillRect(x+22, y+18, 8, 8);
        ctx.fillStyle = '#ffdd44';
        ctx.fillRect(x+10, y+10, 4, 4);
        ctx.fillRect(x+24, y+20, 4, 4);
      } else if (tile === T_BUILDING) {
        ctx.fillStyle = '#8b5e3c';
        ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
        ctx.fillStyle = '#c0845e';
        ctx.fillRect(x+4, y+4, TILE-8, TILE-16);
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(x+14, y+20, 12, 14);
        ctx.fillStyle = '#88aaff';
        ctx.fillRect(x+5, y+8, 8, 8);
      } else if (tile === T_PATH) {
        ctx.fillStyle = 'rgba(180,150,80,0.25)';
        ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
      } else if (tile === T_TOWN) {
        ctx.fillStyle = 'rgba(220,200,130,0.2)';
        ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
      } else if (tile === T_WATER) {
        var ph = worldAnim*0.06 + r*0.7 + c*0.5;
        var isLava = (state.currentZone === 'volcano');
        ctx.fillStyle = isLava ? '#aa3300' : '#3a90e0';
        ctx.fillRect(x+1, y+1, TILE-2, TILE-2);
        ctx.fillStyle = isLava ? 'rgba(255,180,0,0.55)' : 'rgba(190,225,255,0.55)';
        ctx.fillRect(x+6,  y+13 + Math.sin(ph)*3,   12, 2);
        ctx.fillRect(x+22, y+25 + Math.sin(ph+1.5)*3, 10, 2);
        ctx.fillStyle = isLava ? 'rgba(255,100,0,0.5)' : 'rgba(30,80,150,0.5)';
        ctx.fillRect(x+10, y+30 + Math.sin(ph+0.8)*2, 14, 2);
      } else if (tile === T_WARP) {
        var wp = worldAnim*0.08;
        var cxp = x+TILE/2, cyp = y+TILE/2;
        // dark base so the portal pops against any terrain
        ctx.fillStyle = '#1a0833';
        ctx.fillRect(x, y, TILE, TILE);
        // glowing concentric rings
        var k;
        for (k = 0; k < 3; k++) {
          var rad = 6 + k*5 + (Math.sin(wp + k*0.9) + 1) * 3;
          ctx.strokeStyle = 'rgba(190,120,255,' + (0.75 - k*0.18) + ')';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(cxp, cyp, rad, 0, Math.PI*2);
          ctx.stroke();
        }
        // bright swirling core
        ctx.fillStyle = 'rgba(225,190,255,' + (0.6 + Math.sin(wp)*0.3) + ')';
        ctx.beginPath();
        ctx.arc(cxp, cyp, 5, 0, Math.PI*2);
        ctx.fill();
      } else if (tile === T_DEEPGRASS) {
        ctx.fillStyle = '#163a0c';
        ctx.fillRect(x+4, y+10, 3, 18);
        ctx.fillRect(x+13, y+6, 3, 22);
        ctx.fillRect(x+22, y+12, 3, 16);
        ctx.fillRect(x+30, y+8, 3, 20);
        ctx.fillStyle = '#357a1e';
        ctx.fillRect(x+8, y+6, 2, 9);
        ctx.fillRect(x+18, y+3, 2, 9);
        ctx.fillRect(x+27, y+9, 2, 8);
      } else if (tile === T_ROCK) {
        ctx.fillStyle = (r >= 20) ? '#245814' : '#3a8020';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#6b6359';
        ctx.fillRect(x+8, y+12, TILE-16, TILE-18);
        ctx.fillStyle = '#8a8278';
        ctx.fillRect(x+10, y+10, TILE-22, TILE-20);
        ctx.fillStyle = '#a8a098';
        ctx.fillRect(x+13, y+13, 8, 6);
        ctx.fillStyle = '#4a443c';
        ctx.fillRect(x+8, y+26, TILE-16, 4);
      } else if (tile === T_SAND) {
        ctx.fillStyle = '#e6d29a';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = 'rgba(195,170,115,0.6)';
        ctx.fillRect(x+6, y+8, 4, 3);
        ctx.fillRect(x+20, y+14, 4, 3);
        ctx.fillRect(x+12, y+26, 4, 3);
        ctx.fillRect(x+28, y+22, 4, 3);
      }
    }
  }

  // Subtle grid
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.lineWidth = 0.5;
  for (r = startR; r <= endR; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*TILE-camY); ctx.lineTo(CANVAS_W, r*TILE-camY); ctx.stroke();
  }
  for (c = startC; c <= endC; c++) {
    ctx.beginPath(); ctx.moveTo(c*TILE-camX, 0); ctx.lineTo(c*TILE-camX, CANVAS_H); ctx.stroke();
  }

  // Warp / portal destination labels (grouped per destination zone)
  var bob = Math.sin(worldAnim * 0.08) * 3;
  var zWarps = (ZONE_CONFIG[state.currentZone] || {}).warps || [];
  var warpGroups = {};
  for (var wgi = 0; wgi < zWarps.length; wgi++) {
    var wpD = zWarps[wgi];
    if (!warpGroups[wpD.toZone]) warpGroups[wpD.toZone] = { sx: 0, sy: 0, n: 0, miny: 1e9 };
    var g = warpGroups[wpD.toZone];
    g.sx += wpD.x * TILE - camX + TILE/2;
    g.sy += wpD.y * TILE - camY;
    g.miny = Math.min(g.miny, wpD.y * TILE - camY);
    g.n++;
  }
  for (var gz in warpGroups) {
    if (!warpGroups.hasOwnProperty(gz)) continue;
    var gg = warpGroups[gz];
    var lcx = gg.sx / gg.n;
    var lcy = gg.miny;
    if (lcx < -60 || lcx > CANVAS_W + 60 || lcy < -40 || lcy > CANVAS_H + 40) continue;
    var destTitle = (ZONE_CONFIG[gz] || {}).title || gz;
    var labelTxt = '⇄ ' + destTitle;
    ctx.font = 'bold 13px sans-serif';
    var lw = ctx.measureText(labelTxt).width + 18;
    var lx = lcx - lw/2, ly = lcy - 30 + bob;
    ctx.fillStyle = 'rgba(60,20,110,0.92)';
    roundRect(ctx, lx, ly, lw, 22, 8); ctx.fill();
    ctx.strokeStyle = '#c89bff'; ctx.lineWidth = 1.5;
    roundRect(ctx, lx, ly, lw, 22, 8); ctx.stroke();
    ctx.fillStyle = '#f0e0ff';
    ctx.textAlign = 'center';
    ctx.fillText(labelTxt, lcx, ly + 15);
    // little pointer arrow toward the portal
    ctx.fillStyle = '#c89bff';
    ctx.beginPath();
    ctx.moveTo(lcx - 5, ly + 22);
    ctx.lineTo(lcx + 5, ly + 22);
    ctx.lineTo(lcx, ly + 28);
    ctx.closePath(); ctx.fill();
    ctx.textAlign = 'left';
  }

  // NPC Trainers
  var tkeys = Object.keys(TRAINER_DEFS);
  for (var ti = 0; ti < tkeys.length; ti++) {
    var tid = tkeys[ti], tdef = TRAINER_DEFS[tid];
    if (tdef.zone !== state.currentZone) continue;
    var nx2 = tdef.tx * TILE - camX, ny2 = tdef.ty * TILE - camY;
    if (nx2 < -TILE*2 || nx2 > CANVAS_W+TILE || ny2 < -TILE*2 || ny2 > CANVAS_H+TILE) continue;
    var beaten = state.defeatedTrainers[tid];
    var cxn = nx2 + TILE/2;

    // glowing pedestal under the trainer
    var pulse = 0.5 + Math.sin(worldAnim*0.07) * 0.25;
    ctx.fillStyle = beaten ? 'rgba(120,120,140,0.35)' : 'rgba(255,210,40,' + pulse + ')';
    ctx.beginPath();
    ctx.ellipse(cxn, ny2 + TILE - 4, TILE/2 + 3, 9, 0, 0, Math.PI*2);
    ctx.fill();
    if (!beaten) {
      ctx.strokeStyle = 'rgba(255,235,120,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cxn, ny2 + TILE - 4, TILE/2 + 6, 11, 0, 0, Math.PI*2);
      ctx.stroke();
    }

    // trainer emoji (bobbing if active)
    var npcBob = beaten ? 0 : Math.sin(worldAnim*0.09 + ti) * 2;
    ctx.font = '30px serif'; ctx.textAlign = 'center';
    ctx.globalAlpha = beaten ? 0.5 : 1;
    ctx.fillText(tdef.emoji, cxn, ny2 + TILE - 5 + npcBob);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    // name plate above the trainer
    var plate = beaten ? ('✓ ' + tdef.name) : tdef.name;
    ctx.font = 'bold 12px sans-serif';
    var pw = ctx.measureText(plate).width + 14;
    var plx = cxn - pw/2, ply = ny2 - 30;
    ctx.fillStyle = beaten ? 'rgba(40,40,55,0.9)' : 'rgba(20,10,40,0.92)';
    roundRect(ctx, plx, ply, pw, 19, 7); ctx.fill();
    ctx.strokeStyle = beaten ? '#666' : '#ffd700'; ctx.lineWidth = 1.5;
    roundRect(ctx, plx, ply, pw, 19, 7); ctx.stroke();
    ctx.fillStyle = beaten ? '#999' : '#ffd700';
    ctx.textAlign = 'center';
    ctx.fillText(plate, cxn, ply + 14);
    ctx.textAlign = 'left';

    // floating "!" bubble for an undefeated challenger
    if (!beaten) {
      var exB = Math.sin(worldAnim*0.12 + ti) * 2;
      ctx.fillStyle = '#ff3344';
      ctx.beginPath();
      ctx.arc(nx2 + TILE - 6, ny2 - 6 + exB, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('!', nx2 + TILE - 6, ny2 - 1 + exB);
      ctx.textAlign = 'left';
    }
  }

  // Player character
  var px = state.player.x * TILE - camX;
  var py = state.player.y * TILE - camY;
  ctx.fillStyle = '#fff';
  ctx.fillRect(px+8, py+4, 24, 32);
  ctx.fillStyle = '#ffe0b0';
  ctx.fillRect(px+12, py+4, 16, 14);
  ctx.fillStyle = '#3a3aaa';
  ctx.fillRect(px+8, py+18, 24, 16);
  ctx.fillStyle = '#226';
  ctx.fillRect(px+8, py+34, 10, 6);
  ctx.fillRect(px+22, py+34, 10, 6);

  // Zone label
  var zoneLabel = (ZONE_CONFIG[state.currentZone] || {}).title || '探索區';
  if (state.currentZone === 'start') {
    var pr = state.player.y;
    if (pr <= 7) zoneLabel = '初始鎮';
    else if (pr >= 20) zoneLabel = '深林';
    else zoneLabel = '翠綠草原';
  }
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(ctx, CANVAS_W-170, CANVAS_H-44, 162, 36, 8);
  ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(zoneLabel, CANVAS_W-18, CANVAS_H-20);
  ctx.textAlign = 'left';
}

function drawBattle() {
  if (!state.battle) return;
  var b = state.battle;
  var wild = b.wild, player = b.player;

  // Background gradient (actual canvas space)
  ctx.fillStyle = '#151525';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  var grad = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
  grad.addColorStop(0, '#1c1c35');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Divider line (actual canvas space)
  ctx.strokeStyle = '#2a2a55';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, CANVAS_H*0.55); ctx.lineTo(CANVAS_W, CANVAS_H*0.55); ctx.stroke();

  // Scale to 1200×720 virtual space so existing coordinates work
  ctx.save();
  ctx.scale(CANVAS_W/1200, CANVAS_H/720);

  // Wild creature area (top right)
  // Platform shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(820, 280, 110, 24, 0, 0, Math.PI*2);
  ctx.fill();

  // Wild creature emoji (large)
  ctx.font = '130px serif';
  ctx.textAlign = 'center';
  ctx.fillText(wild.emoji, 820, 260);
  ctx.textAlign = 'left';

  // Wild info panel
  ctx.fillStyle = 'rgba(20,20,50,0.92)';
  roundRect(ctx, 570, 42, 390, 130, 14);
  ctx.fill();
  ctx.strokeStyle = '#3355aa';
  ctx.lineWidth = 2;
  roundRect(ctx, 570, 42, 390, 130, 14);
  ctx.stroke();

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(wild.name, 592, 80);

  // Rarity badge (top-right of wild panel)
  var wrar = wild.rarity || 'common';
  ctx.fillStyle = RARITY_COLOR[wrar] || '#aaa';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('◆ ' + (RARITY_NAME[wrar] || ''), 944, 80);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#9999cc';
  ctx.font = '16px sans-serif';
  ctx.fillText('Lv.' + wild.level, 592, 102);

  // Type badge
  ctx.fillStyle = TYPE_COLORS[wild.type] || '#888';
  roundRect(ctx, 648, 86, 72, 22, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(wild.type.toUpperCase(), 684, 102);
  ctx.textAlign = 'left';

  // Wild HP bar background
  ctx.fillStyle = '#222244';
  roundRect(ctx, 592, 114, 348, 18, 9);
  ctx.fill();
  // Wild HP bar fill
  var whpR = Math.max(0, wild.hp / wild.maxHP);
  var whpCol = whpR > 0.5 ? '#44ffaa' : whpR > 0.25 ? '#ffaa44' : '#ff4444';
  ctx.fillStyle = whpCol;
  roundRect(ctx, 592, 114, Math.floor(348 * whpR), 18, 9);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  ctx.fillText('HP ' + wild.hp + '/' + wild.maxHP, 592, 148);

  // Player creature area (bottom left)
  if (!player) return;

  // Platform shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(300, 440, 110, 24, 0, 0, Math.PI*2);
  ctx.fill();

  // Player creature emoji
  ctx.font = '130px serif';
  ctx.textAlign = 'center';
  ctx.fillText(player.emoji, 300, 420);
  ctx.textAlign = 'left';

  // Player info panel
  ctx.fillStyle = 'rgba(20,20,50,0.92)';
  roundRect(ctx, 30, 458, 420, 150, 14);
  ctx.fill();
  ctx.strokeStyle = '#3355aa';
  ctx.lineWidth = 2;
  roundRect(ctx, 30, 458, 420, 150, 14);
  ctx.stroke();

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(player.name, 52, 496);

  ctx.fillStyle = '#9999cc';
  ctx.font = '16px sans-serif';
  ctx.fillText('Lv.' + player.level, 52, 518);

  // Type badge
  ctx.fillStyle = TYPE_COLORS[player.type] || '#888';
  roundRect(ctx, 110, 502, 72, 22, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(player.type.toUpperCase(), 146, 518);
  ctx.textAlign = 'left';

  // HP bar
  ctx.fillStyle = '#222244';
  roundRect(ctx, 52, 530, 378, 18, 9);
  ctx.fill();
  var phpR = Math.max(0, player.hp / player.maxHP);
  var phpCol = phpR > 0.5 ? '#44ffaa' : phpR > 0.25 ? '#ffaa44' : '#ff4444';
  ctx.fillStyle = phpCol;
  roundRect(ctx, 52, 530, Math.floor(378 * phpR), 18, 9);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '13px monospace';
  ctx.fillText('HP ' + player.hp + '/' + player.maxHP, 52, 562);

  // EXP bar
  ctx.fillStyle = '#111133';
  roundRect(ctx, 52, 568, 378, 12, 6);
  ctx.fill();
  var expR = Math.min(1, player.exp / Math.max(1, player.expNeeded));
  ctx.fillStyle = '#44aaff';
  roundRect(ctx, 52, 568, Math.floor(378 * expR), 12, 6);
  ctx.fill();
  ctx.fillStyle = '#7788aa';
  ctx.font = '12px monospace';
  ctx.fillText('EXP ' + player.exp + '/' + player.expNeeded, 52, 594);

  ctx.restore();
}

// ==================== MESSAGE SYSTEM ====================
var MSG_DELAY = 1100; // ms before auto-advancing to next message / callback

function addMsg(text, callback) {
  state.msgQueue.push({ text: text, callback: callback || null });
  if (!state.showingMsg) showNextMsg();
}

function _clearMsgTimer() {
  if (state.msgTimer) { clearTimeout(state.msgTimer); state.msgTimer = null; }
  var bar = document.getElementById('msgTimerBar');
  if (bar) { bar.style.transition = 'none'; bar.style.width = '100%'; }
}

function _startMsgTimer() {
  _clearMsgTimer();
  var bar = document.getElementById('msgTimerBar');
  if (bar) {
    bar.style.transition = 'none'; bar.style.width = '100%';
    // Force reflow then animate to 0
    bar.getBoundingClientRect();
    bar.style.transition = 'width ' + MSG_DELAY + 'ms linear';
    bar.style.width = '0%';
  }
  state.msgTimer = setTimeout(function() {
    state.msgTimer = null;
    advanceMessage();
  }, MSG_DELAY);
}

function showNextMsg() {
  _clearMsgTimer();
  if (state.msgQueue.length === 0) {
    state.showingMsg = false;
    document.getElementById('tapHint').textContent = '';
    if (state.msgCallback) {
      var cb = state.msgCallback;
      state.msgCallback = null;
      cb();
    }
    return;
  }
  state.showingMsg = true;
  var msg = state.msgQueue.shift();
  document.getElementById('msgText').textContent = msg.text;
  if (msg.callback) state.msgCallback = msg.callback;

  var hasMore = state.msgQueue.length > 0 || msg.callback || state.msgCallback;
  if (hasMore) {
    document.getElementById('tapHint').textContent = ' ▸';
    _startMsgTimer();
  } else {
    document.getElementById('tapHint').textContent = '';
  }
}

function advanceMessage() {
  if (state.phase !== 'battle') return;
  if (!state.showingMsg) return;
  _clearMsgTimer();
  if (state.msgQueue.length > 0) {
    showNextMsg();
  } else {
    state.showingMsg = false;
    document.getElementById('tapHint').textContent = '';
    if (state.msgCallback) {
      var cb = state.msgCallback;
      state.msgCallback = null;
      cb();
    }
  }
}

function clearMessages() {
  _clearMsgTimer();
  state.msgQueue = [];
  state.msgCallback = null;
  state.showingMsg = false;
  document.getElementById('msgText').textContent = '';
  document.getElementById('tapHint').textContent = '';
  var bar = document.getElementById('msgTimerBar');
  if (bar) { bar.style.transition = 'none'; bar.style.width = '100%'; }
}

// ==================== BATTLE SYSTEM ====================
function startBattle(zone) {
  var cfg3 = ZONE_CONFIG[state.currentZone] || {};
  var lr = cfg3.levelRange || (zone === 'forest' ? [8,20] : [2,8]);
  var level = lr[0] + Math.floor(Math.random() * (lr[1] - lr[0] + 1));
  var wild = createWildCreature(zone, level);

  // Find first alive party member
  var playerMon = null;
  var i;
  for (i = 0; i < state.party.length; i++) {
    if (state.party[i].hp > 0) { playerMon = state.party[i]; break; }
  }
  if (!playerMon) {
    for (i = 0; i < state.party.length; i++) {
      state.party[i].hp = 1;
    }
    state.player.x = 14;
    state.player.y = 4;
    return;
  }

  state.phase = 'battle';
  state.battle = {
    wild: wild,
    player: playerMon,
    zone: zone,
    waitingAction: true,
    atkModWild: 0,
    cursor: 0,
    cursorMode: 'actions'
  };

  document.getElementById('hud').style.display = 'none';
  document.getElementById('questHud').style.display = 'none';
  document.getElementById('dpad').style.display = 'none';
  document.getElementById('menuBtn').style.display = 'none';
  document.getElementById('battleUI').style.display = 'flex';
  document.getElementById('battleActions').style.display = 'grid';
  document.getElementById('battleMoves').style.display = 'none';

  updateCursorHighlight();

  // Quest progress: first battle, and legendary encounters (called after display
  // changes so updateQuestHUD won't re-show the strip over the battle canvas)
  advanceQuest('battle_count', 1);
  if (wild.rarity === 'legendary') advanceQuest('legendary_battle', 1);

  clearMessages();
  if (wild.rarity === 'legendary') {
    addMsg('⚡ 天地變色…傳說怪獸 ' + wild.name + ' (Lv.' + wild.level + ') 出現了！！');
  } else if (wild.rarity === 'limited') {
    addMsg('🌟 罕見的限定怪獸 ' + wild.name + ' (Lv.' + wild.level + ') 出現了！');
  } else if (wild.shiny) {
    addMsg('✨ 閃耀的異色 ' + wild.name + ' (Lv.' + wild.level + ') 出現了！');
  } else {
    addMsg('野生的 ' + wild.name + ' (Lv.' + wild.level + ') 出現了！');
  }
}

function battleAction(action) {
  if (state.phase !== 'battle') return;
  var b = state.battle;
  if (!b || !b.waitingAction) return;

  if (action === 'fight') {
    showMoveMenu();
    return;
  }

  b.waitingAction = false;
  document.getElementById('battleActions').style.display = 'none';
  document.getElementById('battleMoves').style.display = 'none';

  if (action === 'ball') {
    if (state.items.balls <= 0) {
      addMsg('捕捉球不夠了！');
      b.waitingAction = true;
      document.getElementById('battleActions').style.display = 'grid';
      return;
    }
    state.items.balls--;
    updateHUD();
    addMsg('投出捕捉球！', function() {
      var sp = SPECIES[b.wild.speciesId];
      var catchRate = sp.catchRate || 45;
      var chance = (catchRate * (3 * b.wild.maxHP - 2 * b.wild.hp)) / (3 * b.wild.maxHP * 255);
      if (Math.random() < chance) {
        var rar = b.wild.rarity || 'common';
        var rarMsg = (rar !== 'common') ? '【' + (RARITY_NAME[rar] || '') + '】' : '';
        addMsg('成功捕捉 ' + rarMsg + b.wild.name + '！', function() {
          if (state.party.length < 6) {
            b.wild.exp = 0;
            b.wild.expNeeded = b.wild.level * b.wild.level * 5;
            b.wild.atkMod = 0;
            state.party.push(b.wild);
            advanceQuest('catch_count', 1);
            addMsg(b.wild.name + ' 加入了你的隊伍！', function() { endBattle(); });
          } else {
            addMsg('收藏已滿，野生怪獸逃走了', function() { endBattle(); });
          }
        });
      } else {
        addMsg(b.wild.name + ' 掙脫了！', function() { enemyTurn(); });
      }
    });
    return;
  }

  if (action === 'potion') {
    if (state.items.potions <= 0) {
      addMsg('藥水不夠了！');
      b.waitingAction = true;
      document.getElementById('battleActions').style.display = 'grid';
      return;
    }
    if (b.player.hp >= b.player.maxHP) {
      addMsg(b.player.name + ' HP 已滿，不需要藥水！');
      b.waitingAction = true;
      document.getElementById('battleActions').style.display = 'grid';
      return;
    }
    state.items.potions--;
    updateHUD();
    var heal = Math.min(Math.floor(b.player.maxHP * 0.4), b.player.maxHP - b.player.hp);
    b.player.hp += heal;
    addMsg(b.player.name + ' 回復了 ' + heal + ' HP！', function() { enemyTurn(); });
    return;
  }

  if (action === 'run') {
    var runChance = b.player.spd / (b.wild.spd + b.player.spd + 1);
    if (Math.random() < runChance + 0.3) {
      addMsg('成功逃跑了！', function() { endBattle(); });
    } else {
      addMsg('逃跑失敗！', function() { enemyTurn(); });
    }
    return;
  }
}

function showMoveMenu() {
  var b = state.battle;
  var movesDiv = document.getElementById('battleMoves');
  movesDiv.innerHTML = '';
  document.getElementById('battleActions').style.display = 'none';
  movesDiv.style.display = 'grid';

  var player = b.player;
  var i;
  for (i = 0; i < player.moves.length; i++) {
    (function(moveId) {
      var move = MOVES[moveId];
      var btn = document.createElement('button');
      btn.textContent = move.name + ' (' + move.type + ')';
      btn.className = 'type-' + move.type;
      btn.style.minWidth = '140px';
      btn.style.padding = '10px 14px';
      btn.style.fontSize = '0.95em';
      btn.style.borderRadius = '10px';
      btn.style.border = 'none';
      btn.style.cursor = 'pointer';
      btn.style.fontWeight = 'bold';
      btn.addEventListener('click', function() { useMove(moveId); });
      movesDiv.appendChild(btn);
    })(player.moves[i]);
  }

  var backBtn = document.createElement('button');
  backBtn.textContent = '← 返回';
  backBtn.style.cssText = 'min-width:100px;padding:10px 14px;font-size:0.9em;border-radius:10px;border:none;cursor:pointer;background:#444;color:#fff;font-weight:bold;';
  backBtn.addEventListener('click', function() {
    movesDiv.style.display = 'none';
    document.getElementById('battleActions').style.display = 'grid';
    b.cursorMode = 'actions';
    updateCursorHighlight();
  });
  movesDiv.appendChild(backBtn);
  b.cursorMode = 'moves';
  b.cursor = 0;
  updateCursorHighlight();
}

function useMove(moveId) {
  var b = state.battle;
  b.waitingAction = false;
  document.getElementById('battleActions').style.display = 'none';
  document.getElementById('battleMoves').style.display = 'none';

  var move = MOVES[moveId];
  var player = b.player;
  var wild = b.wild;

  var playerPriority = (move.effect === 'priority') ? 1 : 0;
  var playerFirst = playerPriority > 0 || player.spd >= wild.spd;

  if (playerFirst) {
    doPlayerMove(moveId, function() {
      if (wild.hp <= 0) {
        battleWin();
      } else {
        enemyTurn();
      }
    });
  } else {
    doEnemyMove(function() {
      if (player.hp <= 0) {
        playerDefeated();
      } else {
        doPlayerMove(moveId, function() {
          if (wild.hp <= 0) {
            battleWin();
          } else {
            restoreActions();
          }
        });
      }
    });
  }
}

function doPlayerMove(moveId, callback) {
  var b = state.battle;
  var move = MOVES[moveId];
  var player = b.player;
  var wild = b.wild;

  if (move.effect === 'recover') {
    var healAmt = Math.floor(player.maxHP * 0.5);
    player.hp = Math.min(player.maxHP, player.hp + healAmt);
    addMsg(player.name + ' 使用了 ' + move.name + '，回復了 ' + healAmt + ' HP！', callback);
    return;
  }

  if (move.effect === 'lower_atk') {
    b.atkModWild = Math.max(-3, (b.atkModWild || 0) - 1);
    addMsg(player.name + ' 使用了 ' + move.name + '！' + wild.name + ' 的攻擊降低了！', callback);
    return;
  }

  if (Math.random() * 100 > (move.acc || 100)) {
    addMsg(player.name + ' 使用了 ' + move.name + '，但是沒有命中！', callback);
    return;
  }

  var eff = getTypeEff(move.type, wild.type);
  var atkMod = 1 + (player.atkMod || 0) * 0.25;
  var lvMul = Math.floor(2 * player.level / 5) + 2;
  var rawDmg = Math.floor(lvMul * move.power * (player.atk * atkMod) / Math.max(1, wild.def) * eff * (0.85 + Math.random()*0.15) / 15 + 2);
  var dmg = Math.max(1, rawDmg);
  wild.hp = Math.max(0, wild.hp - dmg);

  var effText = '';
  if (eff >= 2) effText = ' 效果絕佳！';
  else if (eff <= 0.5) effText = ' 效果不好...';

  addMsg(player.name + ' 使用了 ' + move.name + '！造成 ' + dmg + ' 點傷害！' + effText, callback);
}

function doEnemyMove(callback) {
  var b = state.battle;
  var wild = b.wild;
  var player = b.player;

  var moveId = wild.moves[Math.floor(Math.random() * wild.moves.length)];
  var move = MOVES[moveId];

  if (move.effect === 'recover') {
    var healAmt = Math.floor(wild.maxHP * 0.5);
    wild.hp = Math.min(wild.maxHP, wild.hp + healAmt);
    addMsg('野生 ' + wild.name + ' 使用了 ' + move.name + '，回復了 ' + healAmt + ' HP！', callback);
    return;
  }

  if (move.effect === 'lower_atk') {
    player.atkMod = Math.max(-3, (player.atkMod || 0) - 1);
    addMsg('野生 ' + wild.name + ' 使用了 ' + move.name + '！' + player.name + ' 的攻擊降低了！', callback);
    return;
  }

  if (Math.random() * 100 > (move.acc || 100)) {
    addMsg('野生 ' + wild.name + ' 使用了 ' + move.name + '，但是沒有命中！', callback);
    return;
  }

  var eff = getTypeEff(move.type, player.type);
  var atkMod = 1 + (b.atkModWild || 0) * 0.25;
  var lvMul = Math.floor(2 * wild.level / 5) + 2;
  var rawDmg = Math.floor(lvMul * move.power * (wild.atk * atkMod) / Math.max(1, player.def) * eff * (0.85 + Math.random()*0.15) / 15 + 2);
  var dmg = Math.max(1, rawDmg);
  player.hp = Math.max(0, player.hp - dmg);

  var effText = '';
  if (eff >= 2) effText = ' 效果絕佳！';
  else if (eff <= 0.5) effText = ' 效果不好...';

  addMsg('野生 ' + wild.name + ' 使用了 ' + move.name + '！造成 ' + dmg + ' 點傷害！' + effText, callback);
}

function enemyTurn() {
  doEnemyMove(function() {
    if (state.battle.player.hp <= 0) {
      playerDefeated();
    } else {
      restoreActions();
    }
  });
}

function restoreActions() {
  if (!state.battle) return;
  state.battle.waitingAction = true;
  state.battle.cursorMode = 'actions';
  document.getElementById('battleActions').style.display = 'grid';
  document.getElementById('battleMoves').style.display = 'none';
  updateCursorHighlight();
}

function updateCursorHighlight() {
  var b = state.battle;
  if (!b || !b.waitingAction) return;
  var mode = b.cursorMode || 'actions';
  var idx = b.cursor || 0;

  // Clear all highlights
  var actBtns = document.querySelectorAll('#battleActions button');
  var moveBtns = document.querySelectorAll('#battleMoves button');
  [].forEach.call(actBtns, function(btn) { btn.classList.remove('cursor-on'); });
  [].forEach.call(moveBtns, function(btn) { btn.classList.remove('cursor-on'); });

  if (mode === 'actions') {
    var btn = actBtns[idx];
    if (btn) btn.classList.add('cursor-on');
  } else {
    var mBtn = moveBtns[idx];
    if (mBtn) mBtn.classList.add('cursor-on');
  }
}

function battleWin() {
  var b = state.battle;
  var xpMul = b.isTrainer ? 2 : 1; // trainer battles give 2× XP
  var xpGain = b.wild.level * 5 * xpMul;
  addMsg(b.wild.name + ' 被打倒了！');
  addMsg(b.player.name + ' 獲得了 ' + xpGain + ' EXP！', function() {
    var prevLevel = b.player.level;
    var evos = gainExp(b.player, xpGain);
    if (b.player.level > prevLevel) {
      advanceQuest('level_reach', b.player.level);
      addMsg(b.player.name + ' 升到了 Lv.' + b.player.level + '！', function() {
        checkEvolutions(evos, afterBattleWin);
      });
    } else {
      checkEvolutions(evos, afterBattleWin);
    }
  });
}

function afterBattleWin() {
  var b = state.battle;
  if (b && b.isTrainer) { trainerNextMon(); } else { endBattle(); }
}

function checkEvolutions(evos, callback) {
  var cb = callback || function() { endBattle(); };
  if (evos && evos.length > 0) {
    var evo = evos[0];
    addMsg(evo.creature.name + ' 正在進化！', function() {
      performEvolution(evo.creature, evo.to, cb);
    });
  } else {
    cb();
  }
}

// ==================== TRAINER BATTLES ====================
function closeTrainerDialog() {
  document.getElementById('trainerDialog').style.display = 'none';
  state.pendingTrainer = null;
  state.phase = 'world';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('dpad').style.display = 'grid';
  document.getElementById('menuBtn').style.display = 'block';
}

function challengeTrainer(trainerId) {
  var tdef = TRAINER_DEFS[trainerId];
  if (!tdef || state.phase !== 'world') return;
  // Freeze the overworld so the player can't walk away (and trigger a wild
  // battle) while the trainer dialog is open.
  state.phase = 'dialog';
  state.pendingTrainer = trainerId;
  state.dpadDir = null;
  document.getElementById('dpad').style.display = 'none';
  document.getElementById('menuBtn').style.display = 'none';
  var dialogEl = document.getElementById('trainerDialog');
  document.getElementById('trainerDialogEmoji').textContent = tdef.emoji;
  document.getElementById('trainerDialogName').textContent = tdef.name;
  var locked = state.badges < (tdef.requiredBadges || 0);
  var defeated = state.defeatedTrainers[trainerId];
  if (locked) {
    document.getElementById('trainerDialogText').textContent =
      '挑戰我需要 ' + tdef.requiredBadges + ' 個徽章！\n你目前只有 ' + state.badges + ' 個。先去變強！';
    document.getElementById('btnTrainerFight').textContent = '好的';
    document.getElementById('btnTrainerFight').onclick = closeTrainerDialog;
  } else if (defeated) {
    document.getElementById('trainerDialogText').textContent = '你已經打敗過我了！繼續前進吧！';
    document.getElementById('btnTrainerFight').textContent = '繼續！';
    document.getElementById('btnTrainerFight').onclick = closeTrainerDialog;
  } else {
    document.getElementById('trainerDialogText').textContent = tdef.preDialog;
    document.getElementById('btnTrainerFight').textContent = '應戰！';
    document.getElementById('btnTrainerFight').onclick = function() {
      dialogEl.style.display = 'none';
      startTrainerBattle(trainerId);
    };
  }
  dialogEl.style.display = 'flex';
}

function startTrainerBattle(trainerId) {
  var tdef = TRAINER_DEFS[trainerId];
  var playerMon = null;
  for (var i = 0; i < state.party.length; i++) {
    if (state.party[i].hp > 0) { playerMon = state.party[i]; break; }
  }
  if (!playerMon) { closeTrainerDialog(); return; }
  state.pendingTrainer = null;
  var team = [];
  for (var j = 0; j < tdef.teamSpec.length; j++) {
    team.push(createCreature(tdef.teamSpec[j].id, tdef.teamSpec[j].lv));
  }
  state.phase = 'battle';
  state.battle = {
    wild: team[0], player: playerMon,
    zone: state.currentZone, waitingAction: true, atkModWild: 0,
    isTrainer: true, trainerId: trainerId, trainerName: tdef.name,
    trainerTeam: team, trainerIdx: 0,
    cursor: 0, cursorMode: 'actions'
  };
  document.getElementById('hud').style.display = 'none';
  document.getElementById('questHud').style.display = 'none';
  document.getElementById('dpad').style.display = 'none';
  document.getElementById('menuBtn').style.display = 'none';
  document.getElementById('battleUI').style.display = 'flex';
  document.getElementById('battleActions').style.display = 'grid';
  document.getElementById('battleMoves').style.display = 'none';
  document.getElementById('btnBall').disabled = true;
  document.getElementById('btnBall').style.opacity = '0.35';
  clearMessages();
  addMsg(tdef.name + ' 向你發起挑戰！');
  addMsg('對方派出了 ' + team[0].name + ' (Lv.' + team[0].level + ')！');
}

function trainerNextMon() {
  var b = state.battle;
  b.trainerIdx++;
  if (b.trainerIdx < b.trainerTeam.length) {
    var nxt = b.trainerTeam[b.trainerIdx];
    b.wild = nxt; b.atkModWild = 0;
    addMsg(b.trainerName + ' 換出了 ' + nxt.name + ' (Lv.' + nxt.level + ')！', function() {
      restoreActions();
    });
  } else {
    trainerVictory();
  }
}

function trainerVictory() {
  var b = state.battle;
  var tdef = TRAINER_DEFS[b.trainerId];
  state.defeatedTrainers[b.trainerId] = true;
  state.badges = Math.min(4, state.badges + 1);
  document.getElementById('btnBall').disabled = false;
  document.getElementById('btnBall').style.opacity = '';
  addMsg(b.trainerName + ' 被打敗了！');
  addMsg('獲得【' + tdef.badge + '】' + tdef.badgeEmoji + '！', function() {
    if (tdef.isFinalBoss) {
      addMsg(tdef.winDialog, function() { endBattle(); showVictoryScreen(); });
    } else {
      addMsg(tdef.winDialog, function() { endBattle(); });
    }
  });
}

function showVictoryScreen() {

  document.getElementById('victoryText').textContent =

    '集齊了 ' + state.badges + ' 個徽章，\n' +

function performEvolution(creature, toId, callback) {
  var fromName = creature.name;
  var toSp = SPECIES[toId];
  creature.speciesId = toId;
  creature.name = toSp.name;
  creature.emoji = toSp.emoji;
  creature.type = toSp.type;
  var stats = calcStats(toId, creature.level);
  creature.maxHP = stats.maxHP;
  creature.hp = Math.min(creature.hp + (stats.maxHP - creature.maxHP), creature.maxHP);
  creature.atk = stats.atk;
  creature.def = stats.def;
  creature.spd = stats.spd;
  // Learn new moves from evolved species
  var i;
  for (i = 0; i < toSp.moves.length; i++) {
    var m = toSp.moves[i];
    if (m.lv <= creature.level && creature.moves.indexOf(m.id) === -1) {
      creature.moves.push(m.id);
      if (creature.moves.length > 4) creature.moves.shift();
    }
  }
  // Quest: reaching a final evolution form (no further evolution)
  if (!toSp.evo) advanceQuest('final_evo', 1);
  showEvolutionScreen(fromName, creature, callback);
}

function showEvolutionScreen(fromName, creature, callback) {
  document.getElementById('evoEmoji').textContent = creature.emoji;
  document.getElementById('evoTitle').textContent = fromName + ' 進化了！';
  document.getElementById('evoDesc').textContent = '成為了 ' + creature.name + '！';
  document.getElementById('evolutionScreen').style.display = 'flex';
  state.evoCallback = callback;
}

function playerDefeated() {
  var b = state.battle;
  addMsg(b.player.name + ' 倒下了！');
  var next = null;
  var i;
  for (i = 0; i < state.party.length; i++) {
    if (state.party[i] !== b.player && state.party[i].hp > 0) {
      next = state.party[i];
      break;
    }
  }
  if (next) {
    addMsg('換上 ' + next.name + '！', function() {
      b.player = next;
      restoreActions();
    });
  } else {
    addMsg('隊伍全滅了！你回到了初始鎮。', function() {
      for (var j = 0; j < state.party.length; j++) {
        if (state.party[j].hp <= 0) state.party[j].hp = 1;
      }
      state.player.x = 14;
      state.player.y = 4;
      endBattle();

}

function endBattle() {

// ==================== MOVEMENT ====================
function tryMove(dir) {
  if (state.phase !== 'world') return;
  var p = state.player;
  var nx = p.x, ny = p.y;
  if (dir === 'up')    ny--;
  if (dir === 'down')  ny++;
  if (dir === 'left')  nx--;
  if (dir === 'right') nx++;

  if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) return;
  var tile = state.map[ny][nx];
  if (tile === T_TREE || tile === T_BUILDING || tile === T_WATER || tile === T_ROCK) return;

  // Check for NPC trainer at destination. An undefeated trainer blocks the tile
  // and opens the challenge dialog; a defeated one can be walked through freely.
  var nkArr = Object.keys(TRAINER_DEFS), ni2;
  for (ni2 = 0; ni2 < nkArr.length; ni2++) {
    var nid2 = nkArr[ni2], npc2 = TRAINER_DEFS[nid2];
    if (npc2.zone === state.currentZone && npc2.tx === nx && npc2.ty === ny) {
      if (state.defeatedTrainers[nid2]) break; // already beaten — pass through
      challengeTrainer(nid2); return;
    }
  }

  p.x = nx; p.y = ny; p.facing = dir;
  state.steps++;

  // Zone warp tile
  if (tile === T_WARP) {
    var zwarps = (ZONE_CONFIG[state.currentZone] || {}).warps || [], wi3;
    for (wi3 = 0; wi3 < zwarps.length; wi3++) {
      if (zwarps[wi3].x === nx && zwarps[wi3].y === ny) {
        enterZone(zwarps[wi3].toZone, zwarps[wi3].toX, zwarps[wi3].toY); return;
      }
    }
    updateCamera(); return;
  }

  // Quest: reaching the deep forest (rows 20+)
  if (state.currentZone === 'start' && ny >= 20) advanceQuest('reach_forest', 1);

  if (tile === T_GRASS || tile === T_DEEPGRASS) {
    var cfg2 = ZONE_CONFIG[state.currentZone] || {};
    var battleZone = cfg2.encounterZone || (ny >= 20 ? 'forest' : 'route');
    if (Math.random() < 0.15) { startBattle(battleZone); return; }
  }

  updateCamera();
}

// ==================== HUD ====================
function updateHUD() {
  var hudParty = document.getElementById('hudParty');

  for (i = 0; i < state.party.length; i++) {

    div.className = 'hud-mon';

    hudParty.appendChild(div);
  }
  document.getElementById('hudBalls').textContent = state.items.balls;
  document.getElementById('hudPotions').textContent = state.items.potions;
  var hudBadgesEl = document.getElementById('hudBadges');
  if (hudBadgesEl) {
    var bStr = '';
    var tkeys4 = Object.keys(TRAINER_DEFS), bi;

// ==================== SAVE / LOAD ====================
function saveGame() {
  var data = {
    party: state.party,
    player: state.player,
    items: state.items,
    steps: state.steps,
    quests: state.quests,
    currentZone: state.currentZone,
    defeatedTrainers: state.defeatedTrainers,
    badges: state.badges
  };
  try {
    localStorage.setItem('cq_save', JSON.stringify(data));
    var ind = document.getElementById('saveIndicator');
    ind.style.opacity = '1';
    setTimeout(function() { ind.style.opacity = '0'; }, 1500);
  } catch(e) {}
}

function loadGame() {
  try {
    var raw = localStorage.getItem('cq_save');
    if (!raw) { alert('沒有存檔資料！'); return; }
    var data = JSON.parse(raw);
    state.party = data.party;
    state.player = data.player;
    state.items = data.items;
    state.steps = data.steps || 0;
    state.quests = data.quests || { completed: [], activeIdx: 0, progress: {} };
    state.pendingQuests = [];
    state.currentZone = data.currentZone || 'start';
    state.defeatedTrainers = data.defeatedTrainers || {};
    state.badges = data.badges || 0;
    state.zoneMaps = {};
    state.map = getOrCreateZoneMap(state.currentZone);
    // Recalculate stats with current formula so old saves stay consistent
    state.party.forEach(function(m) {
      if (!m.speciesId) return;
      var st = calcStats(m.speciesId, m.level);
      var ratio = Math.max(0, m.hp) / Math.max(1, m.maxHP);
      m.maxHP = st.maxHP; m.hp = Math.max(1, Math.floor(ratio * st.maxHP));
      m.atk = st.atk; m.def = st.def; m.spd = st.spd;
    });

    document.getElementById('titleScreen').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('dpad').style.display = 'grid';
    document.getElementById('menuBtn').style.display = 'block';

    state.phase = 'world';
    updateCamera();
    updateHUD();
    updateQuestHUD();
    requestAnimationFrame(gameLoop);
  } catch(e) {
    alert('載入存檔失敗：' + e.message);
  }
}

// ==================== MAIN LOOP ====================
var lastTime = 0;
var rafId = null;

function gameLoop(timestamp) {
  var dt = timestamp - lastTime;
  lastTime = timestamp;

  if (state.phase === 'world') {
    state.moveTimer -= dt;
    if (state.moveTimer <= 0) {
      var dir = state.dpadDir;
      if (!dir) {
        if (state.keys['ArrowUp']    || state.keys['w'] || state.keys['W']) dir = 'up';
        if (state.keys['ArrowDown']  || state.keys['s'] || state.keys['S']) dir = 'down';
        if (state.keys['ArrowLeft']  || state.keys['a'] || state.keys['A']) dir = 'left';
        if (state.keys['ArrowRight'] || state.keys['d'] || state.keys['D']) dir = 'right';
      }
      if (dir) {
        tryMove(dir);
        state.moveTimer = state.moveDelay;
      }
    }
    if (state.phase === 'world') {
      drawWorld();
    }
  } else if (state.phase === 'battle') {
    drawBattle();
  } else if (state.phase === 'party' || state.phase === 'dialog') {
    drawWorld();
  }
  // 'story' / 'victory' overlay phases draw nothing (the overlay covers the canvas)
  rafId = requestAnimationFrame(gameLoop);
}

// ==================== INPUT ====================
document.addEventListener('keydown', function(e) {
  state.keys[e.key] = true;

  // --- World controls ---
  if ((e.key === 'p' || e.key === 'P') && state.phase !== 'battle') { toggleParty(); return; }

  // --- Battle controls ---
  if (state.phase === 'battle') {
    var b = state.battle;
    // Space always advances messages. Enter advances messages ONLY when not
    // waiting for a menu choice; when waiting, it confirms the cursor instead.
    if (e.key === ' ') { e.preventDefault(); advanceMessage(); return; }

    if (b && b.waitingAction) {
      var actionsVisible = document.getElementById('battleActions').style.display !== 'none';
      var movesVisible   = document.getElementById('battleMoves').style.display !== 'none';
      var cursorMode = b.cursorMode || 'actions';

      // Arrow key navigation
      if (e.key === 'ArrowLeft'  && actionsVisible) { e.preventDefault(); b.cursor = (b.cursor ^ 1); updateCursorHighlight(); return; }
      if (e.key === 'ArrowRight' && actionsVisible) { e.preventDefault(); b.cursor = (b.cursor ^ 1); updateCursorHighlight(); return; }
      if (e.key === 'ArrowUp'    && actionsVisible) { e.preventDefault(); b.cursor = (b.cursor ^ 2); updateCursorHighlight(); return; }
      if (e.key === 'ArrowDown'  && actionsVisible) { e.preventDefault(); b.cursor = (b.cursor ^ 2); updateCursorHighlight(); return; }
      if (e.key === 'ArrowLeft'  && movesVisible) { e.preventDefault(); b.cursor = Math.max(0, b.cursor - 1); updateCursorHighlight(); return; }
      if (e.key === 'ArrowRight' && movesVisible) { e.preventDefault(); b.cursor = Math.min(b.player.moves.length - 1, b.cursor + 1); updateCursorHighlight(); return; }
      if (e.key === 'ArrowUp'    && movesVisible) { e.preventDefault(); b.cursor = Math.max(0, b.cursor - 2); updateCursorHighlight(); return; }
      if (e.key === 'ArrowDown'  && movesVisible) { e.preventDefault(); b.cursor = Math.min(b.player.moves.length - 1, b.cursor + 2); updateCursorHighlight(); return; }

      // Enter to confirm cursor selection
      if (e.key === 'Enter') {
        e.preventDefault();
        if (actionsVisible) {
          var actions = ['fight', 'ball', 'potion', 'run'];
          var act = actions[b.cursor || 0];
          if (act) battleAction(act);
        } else if (movesVisible) {
          var moveIds2 = b.player.moves;
          var mi = b.cursor || 0;
          if (moveIds2[mi]) useMove(moveIds2[mi]);
        }
        return;
      }

      if (actionsVisible) {
        if (e.key === '1') { e.preventDefault(); battleAction('fight'); }
        if (e.key === '2') { e.preventDefault(); battleAction('ball'); }
        if (e.key === '3') { e.preventDefault(); battleAction('potion'); }
        if (e.key === '4') { e.preventDefault(); battleAction('run'); }
      }
      if (movesVisible) {
        if (e.key === 'Escape') {
          document.getElementById('battleMoves').style.display = 'none';
          document.getElementById('battleActions').style.display = 'grid';
          b.cursorMode = 'actions';
          updateCursorHighlight();
        }
        var moveIds = b.player.moves;
        if (e.key === '1' && moveIds[0]) { e.preventDefault(); useMove(moveIds[0]); }
        if (e.key === '2' && moveIds[1]) { e.preventDefault(); useMove(moveIds[1]); }
        if (e.key === '3' && moveIds[2]) { e.preventDefault(); useMove(moveIds[2]); }
        if (e.key === '4' && moveIds[3]) { e.preventDefault(); useMove(moveIds[3]); }
      }
    }
    // Enter outside of waitingAction (e.g. message is scrolling): advance it
    if (e.key === 'Enter') { e.preventDefault(); advanceMessage(); }
    if (e.key === 'Escape' && !b.waitingAction) { /* no-op mid-battle */ }
  } else {
    if (e.key === 'Escape' && state.phase === 'party') closeParty();
  }

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key) !== -1) e.preventDefault();
});

document.addEventListener('keyup', function(e) {
  state.keys[e.key] = false;
});

// D-pad
function setupDpad() {
  function pressDir(dir) {
    return function(e) { e.preventDefault(); state.dpadDir = dir; };
  }
  function releaseDir(e) { e.preventDefault(); state.dpadDir = null; }

  var up = document.getElementById('dpadUp');
  var down = document.getElementById('dpadDown');
  var left = document.getElementById('dpadLeft');
  var right = document.getElementById('dpadRight');

  up.addEventListener('touchstart', pressDir('up'));
  up.addEventListener('mousedown', pressDir('up'));
  down.addEventListener('touchstart', pressDir('down'));
  down.addEventListener('mousedown', pressDir('down'));
  left.addEventListener('touchstart', pressDir('left'));
  left.addEventListener('mousedown', pressDir('left'));
  right.addEventListener('touchstart', pressDir('right'));
  right.addEventListener('mousedown', pressDir('right'));

  document.addEventListener('touchend', releaseDir);
  document.addEventListener('mouseup', releaseDir);
}
