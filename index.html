<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>忍者傳 · 橫向動作</title>
<style>
  :root { --bg:#10131c; --panel:#1b2030; --line:#2c3450; --text:#eef0f6; --sub:#9aa3bd; --accent:#ff8a1f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; display:flex; justify-content:center; }
  #wrap { position:relative; width:100%; max-width:960px; aspect-ratio:16/9; margin-top:8px; }
  canvas { width:100%; height:100%; background:#000; border-radius:8px; display:block; touch-action:none; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:flex-start; gap:10px; padding:16px; background:rgba(12,15,24,.94); border-radius:8px; overflow:auto; }
  .screen.on { display:flex; }
  h1 { margin:8px 0 0; font-size:34px; letter-spacing:4px; color:var(--accent); }
  h2 { margin:0; font-size:22px; }
  p.sub { margin:0; color:var(--sub); font-size:14px; text-align:center; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 18px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.main { background:var(--accent); color:#1a1000; border-color:var(--accent); font-weight:700; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px; width:100%; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:6px; text-align:center; cursor:pointer; font-size:12px; position:relative; }
  .card.locked { opacity:.35; cursor:default; }
  .card.team { border-color:var(--accent); }
  .face { width:44px; height:44px; border-radius:50%; margin:2px auto 4px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#fff; text-shadow:0 1px 2px #000; border:3px solid #f2c9a0; }
  .r1 { color:#b8c0d0; } .r2 { color:#6fd08a; } .r3 { color:#5aa9ff; } .r4 { color:#c07bff; } .r5 { color:#ffc93c; }
  .tag { position:absolute; top:2px; right:4px; font-size:10px; color:var(--accent); }
  #hud-msg { position:absolute; top:8px; left:50%; transform:translateX(-50%); pointer-events:none; font-size:20px; color:#fff; text-shadow:0 2px 4px #000; }
  #touch { display:none; position:absolute; inset:auto 0 6px 0; justify-content:space-between; padding:0 10px; pointer-events:none; }
  #touch .grp { display:flex; gap:8px; pointer-events:auto; }
  #touch button { width:56px; height:56px; padding:0; border-radius:50%; font-size:20px; opacity:.75; }
  @media (pointer:coarse) { #touch.on { display:flex; } }
  .hint { font-size:13px; color:var(--sub); line-height:1.7; }
  kbd { background:#0c0f18; border:1px solid var(--line); border-radius:4px; padding:1px 6px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="hud-msg"></div>
  <div id="touch">
    <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="grp"><button data-k="s1">1</button><button data-k="s2">2</button><button data-k="s3">3</button></div>
    <div class="grp"><button data-k="skill">✦</button><button data-k="atk">⚔</button><button data-k="jump">▲</button></div>
  </div>

  <div class="screen on" id="menu">
    <h1>忍者傳</h1>
    <p class="sub">橫向動作 · 收集角色 · 組隊闖關（非商業同人作品）</p>
    <div class="row"><b>目前關卡：</b><button data-d="-1">◀</button><b id="stg-n">1</b><button data-d="1">▶</button></div>
    <div class="row"><b>查克拉幣：</b><b id="coins" style="color:#ffc93c">0</b></div>
    <div class="row"><button class="main" id="b-play">出發！</button><button id="b-gacha">忍者召喚</button><button id="b-coll">圖鑑 / 編隊</button><button id="b-help">操作說明</button></div>
    <div class="row" id="team-preview"></div>
    <p class="sub">存檔在你的瀏覽器裡（localStorage）。</p>
  </div>

  <div class="screen" id="gacha">
    <h2>忍者召喚</h2>
    <p class="sub">每次 100 查克拉幣，重複角色會強化該角色（每次 +10% 屬性）。</p>
    <div class="row"><b>查克拉幣：</b><b id="coins2" style="color:#ffc93c">0</b></div>
    <div class="row"><button class="main" id="pull1">召喚 ×1（100）</button><button class="main" id="pull10">召喚 ×10（900）</button><button id="g-back">返回</button></div>
    <div class="grid" id="pull-res"></div>
  </div>

  <div class="screen" id="coll">
    <h2>圖鑑 / 編隊 <span id="coll-count" class="sub"></span></h2>
    <p class="sub">點選已擁有的角色加入或移出隊伍（最多 3 人，至少 1 人）。</p>
    <div class="row" id="coll-team"></div>
    <div class="grid" id="coll-grid"></div>
    <button id="c-back">返回</button>
  </div>

  <div class="screen" id="help">
    <h2>操作說明</h2>
    <div class="hint">
      <div><kbd>A</kbd> <kbd>D</kbd> 或 <kbd>←</kbd> <kbd>→</kbd>：移動</div>
      <div><kbd>W</kbd> / <kbd>↑</kbd> / <kbd>空白鍵</kbd>：跳躍</div>
      <div><kbd>J</kbd> / <kbd>Z</kbd>：普通攻擊（按住連打）</div>
      <div><kbd>K</kbd> / <kbd>X</kbd>：角色專屬忍術（有冷卻時間）</div>
      <div><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>：切換隊伍角色，每個人的血量分開計算</div>
      <div>擊敗敵人賺查克拉幣，打倒關底頭目過關，用幣去召喚新角色。</div>
    </div>
    <button id="h-back">返回</button>
  </div>

  <div class="screen" id="result">
    <h2 id="res-title"></h2>
    <p class="sub" id="res-text"></p>
    <div class="row"><button class="main" id="r-next">再來一次</button><button id="r-menu">回主選單</button></div>
  </div>
</div>
<script src="characters.js"></script>
<script src="chibi.js"></script>
<script src="game.js"></script>
</body>
</html>
