<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOYOTA Quest - 找尋你的夥伴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap');

  :root {
    --pixel: 4px;
    --bg: #0a0a1a;
    --bg2: #111128;
    --panel: #1a1a3a;
    --panel2: #12122a;
    --border: #4a4aff;
    --border2: #2a2a8a;
    --gold: #ffd700;
    --red: #ff4444;
    --green: #44ff88;
    --blue: #4488ff;
    --white: #e8e8ff;
    --gray: #888899;
    --toyota-red: #eb0a1e;
    --toyota-dark: #1a0005;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== TITLE SCREEN ===== */
  #titleScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at center, #1a0020 0%, #0a0010 60%, #000 100%);
    position: fixed;
    z-index: 100;
  }

  .title-logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 3vw, 28px);
    color: var(--toyota-red);
    text-shadow: 4px 4px 0 #600, 0 0 30px #ff000055;
    letter-spacing: 4px;
    margin-bottom: 8px;
    animation: titlePulse 2s ease-in-out infinite;
  }

  .title-sub {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.5vw, 12px);
    color: var(--gold);
    text-shadow: 2px 2px 0 #660;
    margin-bottom: 50px;
    letter-spacing: 2px;
  }

  .title-car {
    font-size: 80px;
    margin-bottom: 30px;
    animation: carBounce 1s ease-in-out infinite;
    filter: drop-shadow(0 0 20px var(--toyota-red));
  }

  .start-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.5vw, 11px);
    color: var(--white);
    background: var(--toyota-red);
    border: 3px solid #ff8888;
    padding: 14px 28px;
    cursor: pointer;
    transition: all 0.1s;
    animation: blink 1.2s step-end infinite;
    letter-spacing: 2px;
  }

  .start-btn:hover {
    background: #ff2233;
    transform: scale(1.05);
    animation: none;
  }

  @keyframes titlePulse { 0%,100%{opacity:1} 50%{opacity:.85} }
  @keyframes carBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ===== GAME CONTAINER ===== */
  #gameContainer {
    display: none;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    max-width: 480px;            /* 桌機也維持手機般的緊湊直式框 */
    margin: 0 auto;
    position: relative;
    box-shadow: 0 0 0 2px #2a2a5a, 0 0 40px rgba(0,0,0,0.6);
  }

  /* ===== TOP HUD ===== */
  #hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--panel2);
    border-bottom: 3px solid var(--border2);
    flex-shrink: 0;
  }

  .hud-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gold);
  }

  .hud-stats {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .stat-block { display: flex; align-items: center; gap: 5px; }
  .stat-label { font-size: 10px; color: var(--gray); }
  .stat-bar-wrap { width: 70px; height: 10px; background: #222; border: 1px solid #444; }
  .stat-bar { height: 100%; transition: width 0.3s; }
  .hp-bar { background: linear-gradient(90deg, var(--green), #22cc66); }
  .sp-bar { background: linear-gradient(90deg, var(--blue), #22aaff); }
  .stat-val { font-size: 10px; color: var(--white); min-width: 30px; font-family: 'Press Start 2P', monospace; }

  .hud-lv {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gold);
    background: #2a2a00;
    border: 2px solid var(--gold);
    padding: 3px 7px;
  }

  /* ===== MAP AREA ===== */
  #mapArea {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0a1a0a;
  }

  #mapCanvas {
    position: absolute;
    top: 0; left: 0;
    image-rendering: pixelated;
  }

  /* ===== DIALOG BOX ===== */
  #dialogBox {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--panel2);
    border-top: 3px solid var(--border);
    padding: 14px 18px 14px;
    display: none;
    min-height: 100px;
    z-index: 10;
  }

  #dialogSpeaker {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--gold);
    margin-bottom: 8px;
  }

  #dialogText {
    font-size: 13px;
    line-height: 1.8;
    color: var(--white);
    min-height: 38px;
  }

  #dialogChoices {
    display: none;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }

  .choice-btn {
    font-size: 12px;
    background: #1a1a3a;
    border: 2px solid var(--border2);
    color: var(--white);
    padding: 7px 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.1s;
  }
  .choice-btn:hover, .choice-btn.selected {
    background: var(--border);
    border-color: var(--border);
    color: #fff;
  }

  #dialogNext {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--gray);
    text-align: right;
    margin-top: 6px;
    animation: blink 0.8s step-end infinite;
  }

  /* ===== BATTLE SCREEN ===== */
  #battleScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #05050c;
    flex-direction: column;
    align-items: center;     /* 桌機置中成 480 直式框 */
  }

  #battleBg {
    flex: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(180deg, #1a0a2a 0%, #0a0a1a 60%, #1a1a00 100%);
    overflow: hidden;
  }

  .battle-ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: repeating-linear-gradient(90deg, #2a2a1a 0px, #2a2a1a 8px, #221a00 8px, #221a00 16px);
  }

  /* Enemy side */
  .enemy-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 1;
  }

  .enemy-name-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--red);
    background: #1a0000;
    border: 2px solid var(--red);
    padding: 4px 8px;
  }

  .enemy-hp-wrap {
    width: 140px;
    height: 12px;
    background: #222;
    border: 2px solid #666;
  }

  .enemy-hp-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--red), #ff8844);
    transition: width 0.5s;
  }

  .enemy-sprite {
    font-size: 62px;
    filter: drop-shadow(0 0 15px rgba(255,68,68,0.5));
    animation: enemyFloat 2s ease-in-out infinite;
    margin: 10px 0;
  }

  @keyframes enemyFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes enemyHit { 0%,100%{filter:drop-shadow(0 0 15px rgba(255,68,68,0.5))} 50%{filter:drop-shadow(0 0 30px rgba(255,255,255,1)) brightness(3)} }
  @keyframes playerHit { 0%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} 100%{transform:translateX(0)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)} }

  /* Player side */
  .player-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 1;
  }

  .player-sprite {
    font-size: 70px;
    filter: drop-shadow(0 0 12px rgba(68,136,255,0.6));
  }

  .player-name-tag {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--blue);
    background: #00081a;
    border: 2px solid var(--blue);
    padding: 4px 8px;
  }

  .player-stats {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 4px;
    width: 150px;
  }
  .pstat-row { display: flex; align-items: center; gap: 6px; }
  .pstat-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    width: 16px;
    color: var(--gray);
  }
  .pstat-bar-wrap {
    flex: 1;
    height: 11px;
    background: #222;
    border: 2px solid #555;
  }
  .pstat-bar { height: 100%; transition: width 0.35s; }
  .pstat-hp { background: linear-gradient(90deg, var(--green), #22cc66); }
  .pstat-sp { background: linear-gradient(90deg, var(--blue), #22aaff); }
  .pstat-val {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--white);
    min-width: 44px;
    text-align: right;
  }

  /* Battle Panel — 直式緊湊版(桌機/手機一致)：選項在上、戰鬥訊息在下並固定高度內部捲動 */
  #battlePanel {
    background: var(--panel2);
    border-top: 3px solid var(--border);
    padding: 10px 12px;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    flex-shrink: 0;
    overflow: hidden;
  }

  #battleLog {
    width: 100%;
    flex: 0 0 auto;
    height: 70px;
    min-height: 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--white);
    border: 2px solid var(--border2);
    padding: 6px 10px;
    background: #0a0a1a;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  #battleLog::-webkit-scrollbar { width: 8px; }
  #battleLog::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .battle-log-line { margin-bottom: 2px; }
  .log-player { color: var(--blue); }
  .log-enemy { color: var(--red); }
  .log-system { color: var(--gold); }

  #battleActions {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
  }

  #battleQuestion {
    font-size: 12px;
    line-height: 1.4;
    color: var(--gold);
    background: #15152e;
    border: 2px solid var(--border2);
    padding: 6px 9px;
    flex-shrink: 0;
  }

  #battleOptions { display: flex; flex-direction: column; gap: 4px; }

  .opt-btn {
    font-size: 12px;
    background: var(--panel);
    border: 2px solid var(--border2);
    color: var(--white);
    padding: 6px 10px;
    cursor: pointer;
    transition: all 0.1s;
    text-align: left;
    line-height: 1.25;
  }
  .opt-btn:hover:not(:disabled) {
    background: var(--border);
    border-color: #8888ff;
    transform: translateX(2px);
  }
  .opt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .opt-btn.selected {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(255,215,0,0.45) inset;
    background: #24243f;
    transform: translateX(2px);
  }
  .opt-btn .opt-key { color: var(--gold); font-family: 'Press Start 2P', monospace; font-size: 9px; margin-right: 6px; }

  .opt-btn.ult-opt {
    border-color: #7a4fd0; color: #d9b6ff;
    background: #221636;
  }
  .opt-btn.ult-opt:hover:not(:disabled) { background: #3a2466; border-color: #a86bff; }
  .opt-btn.item-opt {
    border-color: #6a5320; color: #ffd06a; margin-top: auto; flex-shrink: 0;
  }
  .opt-btn.item-opt:hover:not(:disabled) { background: #3a2e10; }

  /* ===== RESULT SCREEN ===== */
  #resultScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  .result-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(10px, 2vw, 18px);
    color: var(--gold);
    text-shadow: 3px 3px 0 #660;
    margin-bottom: 20px;
    text-align: center;
  }

  .result-cars {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
    max-width: 700px;
  }

  .car-card {
    background: var(--panel);
    border: 3px solid var(--border2);
    padding: 16px;
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .car-card.top-pick {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
  }

  .car-card.top-pick::before {
    content: '★ 最適合';
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    background: var(--gold);
    color: #000;
    padding: 3px 6px;
    position: absolute;
    top: 0; right: 0;
  }

  .car-emoji { font-size: 40px; }
  .car-name { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--gold); text-align: center; }
  .car-score-bar { width: 100%; height: 8px; background: #222; border: 1px solid #444; }
  .car-score-fill { height: 100%; background: linear-gradient(90deg, var(--toyota-red), #ff8844); transition: width 1s ease; }
  .car-desc { font-size: 10px; color: var(--gray); text-align: center; line-height: 1.5; }

  .result-profile {
    background: var(--panel);
    border: 2px solid var(--border2);
    padding: 14px 20px;
    max-width: 500px;
    width: 100%;
    margin-bottom: 16px;
  }

  .profile-title { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--blue); margin-bottom: 10px; }
  .profile-text { font-size: 13px; line-height: 1.9; color: var(--white); }

  /* ===== REPORT CARD ===== */
  .report-card {
    background: var(--panel);
    border: 2px solid var(--border2);
    padding: 14px 18px;
    max-width: 520px;
    width: 100%;
    margin-bottom: 16px;
  }
  .report-head {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 2px dashed var(--border2); padding-bottom: 10px; margin-bottom: 10px;
  }
  .report-head .rh-title { font-family:'Press Start 2P',monospace; font-size: 10px; color: var(--gold); }
  .report-grade {
    font-family:'Press Start 2P',monospace; font-size: 22px; color:#000;
    background: var(--gold); border-radius: 8px; padding: 6px 12px;
    box-shadow: 0 0 16px rgba(255,215,0,0.5);
  }
  .report-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .report-table td { padding: 5px 4px; border-bottom: 1px solid #2a2a4a; }
  .report-table td.rt-label { color: var(--gray); }
  .report-table td.rt-val { color: var(--white); text-align: right; font-family:'Press Start 2P',monospace; font-size: 10px; }

  /* full ranking bars */
  .rank-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .rank-emoji { font-size: 20px; width: 26px; text-align:center; }
  .rank-name { font-family:'Press Start 2P',monospace; font-size: 7px; color: var(--gold); width: 84px; }
  .rank-bar-wrap { flex:1; height: 13px; background:#222; border:1px solid #444; position:relative; }
  .rank-bar { height:100%; background: linear-gradient(90deg, var(--toyota-red), #ff8844); width:0; transition: width 1s ease; }
  .rank-pct { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--white); width:34px; text-align:right; }
  .rank-row.top .rank-name { color:#fff; }
  .rank-row.top .rank-bar { background: linear-gradient(90deg, var(--gold), #ffcc44); }

  /* ===== SHARE CARD ===== */
  #shareCanvas {
    width: 340px;
    max-width: 92vw;
    height: auto;
    border-radius: 14px;
    box-shadow: 0 6px 30px rgba(0,0,0,0.6);
    margin-bottom: 12px;
  }
  .share-copy {
    max-width: 340px;
    width: 92vw;
    background: #12122a;
    border: 1px dashed #3a6b3a;
    color: #cfe0c8;
    font-size: 12px;
    line-height: 1.6;
    padding: 8px 12px;
    margin-bottom: 12px;
    text-align: center;
    border-radius: 6px;
  }
  .result-btns { display: flex; gap: 10px; margin-bottom: 10px; }
  .rbtn {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 11px 18px;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid var(--border2);
    background: var(--panel);
    color: var(--white);
    transition: all 0.1s;
    text-decoration: none;
    display: inline-block;
    text-align: center;
  }
  .rbtn:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .rbtn.cta {
    background: var(--toyota-red);
    border-color: #ff8888;
    color: #fff;
    width: 340px; max-width: 92vw;
    margin-bottom: 10px;
    font-size: 14px;
    padding: 13px 18px;
  }

  .result-replay {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    background: transparent;
    border: 2px solid var(--border2);
    color: var(--gray);
    padding: 10px 22px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.1s;
    border-radius: 8px;
  }
  .result-replay:hover { color:#fff; border-color: var(--border); }

  /* ===== MAP CONTROLS HINT ===== */
  #controlsHint {
    position: absolute;
    bottom: 8px;
    right: 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--gray);
    line-height: 1.8;
    text-align: right;
    z-index: 5;
    pointer-events: none;
  }

  /* ===== MINIMAP ===== */
  #minimap {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 80px;
    height: 80px;
    border: 2px solid var(--border2);
    background: rgba(0,0,0,0.7);
    z-index: 5;
  }

  /* ===== NOTIFICATION ===== */
  #notification {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: #000;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 8px 16px;
    z-index: 500;
    display: none;
    letter-spacing: 1px;
    animation: slideDown 0.3s ease;
  }

  @keyframes slideDown { from{transform:translateX(-50%) translateY(-20px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }

  /* ===== PROGRESS TRACKER ===== */
  #progressTracker {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.75);
    border: 2px solid var(--border2);
    padding: 6px 10px;
    z-index: 5;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--gray);
    line-height: 1.8;
  }

  .prog-label { color: var(--gold); margin-bottom: 2px; }

  /* ===== TOUCH CONTROLS ===== */
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  #touchControls {
    display: none;
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    z-index: 8;
    pointer-events: none;
    padding: 0 18px;
    justify-content: space-between;
    align-items: flex-end;
    user-select: none;
  }
  body.touch #touchControls { display: flex; }

  #dpad {
    position: relative;
    width: 150px;
    height: 150px;
    pointer-events: none;
  }

  .dbtn {
    position: absolute;
    width: 50px;
    height: 50px;
    background: rgba(26,26,58,0.78);
    border: 2px solid var(--border2);
    color: var(--white);
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.08s;
  }
  .dbtn:active { background: var(--border); }
  .dbtn.up    { top: 0;    left: 50px; }
  .dbtn.left  { top: 50px; left: 0; }
  .dbtn.right { top: 50px; left: 100px; }
  .dbtn.down  { top: 100px;left: 50px; }

  #btnInteract {
    pointer-events: auto;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(235,10,30,0.82);
    border: 3px solid #ff8888;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #btnInteract:active { background: #ff2233; }

  { id:'spike2', type:'spike', x:13, y:5,  dmg:8 },
  { id:'spike3', type:'spike', x:14, y:8,  dmg:10 },
  { id:'portalA', type:'teleport', x:2,  y:13, tx:18, ty:1 },
  { id:'portalB', type:'teleport', x:18, y:1,  tx:2,  ty:13 },
];
let trapCooldown = {};      // 尖刺冷卻
let teleportLock = false;   // 避免落地後立刻又被傳送回去

// ============================================================
// ROAMING MOBS (會遊走的小怪)
// 隨機出現、靠近 2 格會追過來開戰；只給 EXP，不影響最終判斷
// ============================================================
const MOB_TYPES = [
  { name:'路怒蝙蝠', sprite:'🦇', hp:24, atk:6, dialogue:'吱吱吱！別擋我的路！' },
  { name:'坑洞地鼠', sprite:'🐀', hp:30, atk:7, dialogue:'吱——這是我的地盤！' },
  { name:'迷途幽魂', sprite:'👻', hp:22, atk:5, dialogue:'嗚……陪我玩嘛……' },
  { name:'路面石魔', sprite:'🪨', hp:36, atk:8, dialogue:'轟……擋路者……粉碎……' },
  { name:'噪音飛蟲', sprite:'🐝', hp:20, atk:6, dialogue:'嗡嗡嗡嗡嗡！' },
];
let mobs = [];
const MAX_MOBS = 4;
let currentBattleIsMob = false;

// ============================================================
// PLAYER POSITION
// ============================================================
let player = { x: 5, y: 5, dir: 'down', step: 0 }; // tile coords + facing + walk frame
let canvas, ctx, minimapCanvas, minimapCtx;
let mapOffX = 0, mapOffY = 0;
let currentBattleEnemy = null;
let enemyDefeated = new Set();
let npcSpoken = new Set();
let enemyPositions = [];
let lastMoveTime = -9999;
let nearestEnemy = null;

// ============================================================
// INIT
// ============================================================
function startGame() {
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'flex';

  canvas = document.getElementById('mapCanvas');
  ctx = canvas.getContext('2d');
  minimapCanvas = document.getElementById('minimap');
  minimapCtx = minimapCanvas.getContext('2d');

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Place enemies randomly on passable tiles
  spawnEnemies();

  document.addEventListener('keydown', handleKey);
  setupTouchControls();
  requestAnimationFrame(gameLoop);

  // Roaming mobs: periodically spawn, and move/chase on a steady tick
  setInterval(spawnMobTick, 4500);
  setInterval(updateMobs, 480);

  // Show intro dialog
  setTimeout(() => {
    showDialog('旅館老闆', ['歡迎勇者！這片大地等著你去探索。','跟著金色箭頭，依序挑戰五道試煉。','小心！路上有四處遊走的小怪，','一旦靠到牠們身邊就會撲上來與你開戰！','你的每個選擇，將決定最適合你的 Toyota 座駕。','準備好了嗎？GO！'], null);
  }, 500);

  updateHUD();
}

function resizeCanvas() {
  const area = document.getElementById('mapArea');
  canvas.width = area.clientWidth;
  canvas.height = area.clientHeight;
  minimapCanvas.width = 80;
  minimapCanvas.height = 80;
}

function spawnEnemies() {
  enemyPositions = [];
  const positions = [
    {x:8,y:3},{x:14,y:5},{x:11,y:9},{x:4,y:11},{x:16,y:11}
  ];
  ENEMIES.forEach((e,i) => {
    enemyPositions.push({...positions[i], enemy: e, defeated: false});
  });
}

// ============================================================
// ROAMING MOB HELPERS
// ============================================================
function tilePassable(x,y){
  if(x<0||x>=MAP_W||y<0||y>=MAP_H) return false;
  return !!TILE_PASSABLE[MAP_DATA[y][x]];
}

// Is a tile occupied by something that a mob shouldn't stand on?
function tileBlockedForMob(x,y){
  if(enemyPositions.some(ep=>!ep.defeated && ep.x===x && ep.y===y)) return true;
  if(mobs.some(m=>m.x===x && m.y===y)) return true;
  if(NPC_DIALOGS.some(n=>n.x===x && n.y===y)) return true;
  return false;
}

function spawnMobTick(){
  if(STATE.inBattle || STATE.inDialog) return;
  if(document.getElementById('gameContainer').style.display==='none') return;
  if(mobs.length >= MAX_MOBS) return;
  // Find a random passable tile a few tiles away from the player
  for(let tries=0; tries<30; tries++){
    const x = 1+Math.floor(Math.random()*(MAP_W-2));
    const y = 1+Math.floor(Math.random()*(MAP_H-2));
    if(!tilePassable(x,y) || tileBlockedForMob(x,y)) continue;
    const dist = Math.max(Math.abs(x-player.x), Math.abs(y-player.y));
    if(dist < 4) continue; // don't spawn on top of the player
    const t = MOB_TYPES[Math.floor(Math.random()*MOB_TYPES.length)];
    mobs.push({ x, y, type:t, spawnTick:tick });
    break;
  }
}

function updateMobs(){
  if(STATE.inBattle || STATE.inDialog) return;
  if(document.getElementById('gameContainer').style.display==='none') return;
  for(const m of mobs){
    const cheby = Math.max(Math.abs(player.x-m.x), Math.abs(player.y-m.y));
    // Aggro range is 1 tile only: just wander, fight only on direct contact
    if(cheby<=1){ startMobBattle(m); return; }
    m.chasing = false;
    if(Math.random()<0.5){
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      const d=dirs[Math.floor(Math.random()*4)];
      const nx=m.x+d[0], ny=m.y+d[1];
      if(tilePassable(nx,ny) && !tileBlockedForMob(nx,ny)){ m.x=nx; m.y=ny; }
    }
  }
}

// Player walked onto / next to a mob
function checkMobEncounter(){
  for(const m of mobs){
    if(Math.max(Math.abs(player.x-m.x), Math.abs(player.y-m.y))<=1){
      startMobBattle(m); return;
    }
  }
}

// ============================================================
// TRAP / MECHANISM HELPERS
// ============================================================
function checkTraps(){
  const onPortal = TRAPS.find(t=>t.type==='teleport' && t.x===player.x && t.y===player.y);
  // Spikes
  const spike = TRAPS.find(t=>t.type==='spike' && t.x===player.x && t.y===player.y);
  if(spike){
    const now=performance.now();
    if(!trapCooldown[spike.id] || now-trapCooldown[spike.id]>900){
      trapCooldown[spike.id]=now;
      STATE.stats.coneHits++;
      STATE.player.hp=Math.max(1, STATE.player.hp-spike.dmg);
      updateHUD();
      showNotification('⚠️ 撞到三角錐！-'+spike.dmg+' HP');
      const area=document.getElementById('mapArea');
      area.style.animation='none'; void area.offsetWidth; area.style.animation='shake 0.3s';
    }
  }
  // Teleporters (locked right after arriving so we don't bounce back)
  if(onPortal){
    if(teleportLock) return;       // just arrived here; wait until we step off
    teleportLock=true;
    player.x=onPortal.tx; player.y=onPortal.ty;
    showNotification('🌀 傳送門！瞬間移動');
  } else {
    teleportLock=false;            // stepped off a portal → re-arm
  }
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = 0;
let tick = 0;
function gameLoop(ts) {
  const dt = ts - lastTime;
  lastTime = ts;
  tick++;
  renderMap();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// RENDER
// ============================================================
function renderMap() {
  if(!canvas || !ctx) return;
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // Center camera on player
  mapOffX = Math.floor(W/2 - player.x*TILE - TILE/2);
  mapOffY = Math.floor(H/2 - player.y*TILE - TILE/2);

  // Draw tiles
  for(let ty=0;ty<MAP_H;ty++){
    for(let tx=0;tx<MAP_W;tx++){
      const t = MAP_DATA[ty][tx];
      const sx = tx*TILE+mapOffX, sy = ty*TILE+mapOffY;
      if(sx > W || sy > H || sx < -TILE || sy < -TILE) continue;

      ctx.fillStyle = TILE_COLORS[t];
      ctx.fillRect(sx,sy,TILE,TILE);

      // Tile details
      if(t===0){ // grass pattern
        ctx.fillStyle = '#3a6a20';
        if((tx+ty)%3===0) ctx.fillRect(sx+4,sy+4,4,4);
        if((tx*ty)%5===0) ctx.fillRect(sx+20,sy+16,4,4);
      }
      if(t===1){ // path lines
        ctx.fillStyle = '#7a6045';
        ctx.fillRect(sx,sy+14,TILE,4);
      }
      if(t===2){ // tree
        ctx.fillStyle = '#0d2206';
        ctx.fillRect(sx,sy,TILE,TILE);
        ctx.fillStyle = '#2a7a10';
        ctx.beginPath();
        ctx.arc(sx+TILE/2,sy+TILE/2,12,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#1a5a08';
        ctx.fillRect(sx+12,sy+20,8,12);
      }
      if(t===3){ // water
        ctx.fillStyle = t===3?'#1e4a8a':'#1a3a6a';
        ctx.fillRect(sx,sy,TILE,TILE);
        if(tick%60<30){
          ctx.fillStyle='rgba(255,255,255,0.15)';
          ctx.fillRect(sx+4,sy+12,12,2);
          ctx.fillRect(sx+16,sy+20,10,2);
        }
      }
      if(t===4){ // building
        ctx.fillStyle='#7a6a3a';
        ctx.fillRect(sx+2,sy+8,TILE-4,TILE-8);
        ctx.fillStyle='#5a4a2a';
        ctx.fillRect(sx,sy+2,TILE,8);
        ctx.fillStyle='#ffcc44';
        ctx.fillRect(sx+10,sy+18,12,TILE-18);
      }
      if(t===5){ // mountain
        ctx.fillStyle='#888';
        ctx.beginPath();
        ctx.moveTo(sx+TILE/2,sy+4);
        ctx.lineTo(sx+TILE-4,sy+TILE-4);
        ctx.lineTo(sx+4,sy+TILE-4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle='#fff';
        ctx.beginPath();
        ctx.moveTo(sx+TILE/2,sy+4);
        ctx.lineTo(sx+TILE/2+6,sy+14);
        ctx.lineTo(sx+TILE/2-6,sy+14);
        ctx.closePath();
        ctx.fill();
      }

      // Grid lines (subtle)
      ctx.strokeStyle='rgba(0,0,0,0.1)';
      ctx.strokeRect(sx,sy,TILE,TILE);
    }
  }

  // Draw traps / mechanisms (on the ground, beneath actors)
  TRAPS.forEach(tr => {
    const sx = tr.x*TILE+mapOffX, sy = tr.y*TILE+mapOffY;
    if(tr.type==='spike'){
      const out = true;                  // 固定顯示，不再閃爍
      ctx.fillStyle='#3a3320';
      ctx.fillRect(sx+3,sy+3,TILE-6,TILE-6);
      ctx.fillStyle = out ? '#cfd6e0' : '#6a7080';
      for(let i=0;i<3;i++){
        const bx=sx+7+i*7;
        ctx.beginPath();
        ctx.moveTo(bx, sy+TILE-7);
        ctx.lineTo(bx+3, out? sy+8 : sy+16);
        ctx.lineTo(bx+6, sy+TILE-7);
        ctx.closePath(); ctx.fill();
      }
    } else if(tr.type==='teleport'){
      const r = 9 + Math.sin(tick*0.15)*2;
      ctx.save();
      ctx.translate(sx+TILE/2, sy+TILE/2);
      ctx.rotate(tick*0.06);
      const grd=ctx.createRadialGradient(0,0,1,0,0,r);
      grd.addColorStop(0,'#cdaaff'); grd.addColorStop(1,'rgba(120,60,255,0.15)');
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#a86bff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,r,0.3,Math.PI*1.3); ctx.stroke();
      ctx.restore();
    }
  });

  // Draw roaming mobs
  mobs.forEach(m => {
    const sx = m.x*TILE+mapOffX, sy = m.y*TILE+mapOffY;
    const float = Math.sin(tick*0.1+m.x)*2;
    // chase indicator (it spotted you!)
    if(m.chasing){
      ctx.fillStyle='rgba(255,120,0,'+(0.25+Math.sin(tick*0.2)*0.15)+')';
      ctx.beginPath(); ctx.arc(sx+TILE/2, sy+TILE/2, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff7a00';
      ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
      ctx.fillText('!', sx+TILE/2, sy-4+Math.sin(tick*0.2)*2);
    }
    ctx.font='18px serif'; ctx.textAlign='center';
    ctx.fillText(m.type.sprite, sx+TILE/2, sy+TILE/2+float);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(sx+TILE/2,sy+TILE-5,8,3,0,0,Math.PI*2); ctx.fill();
  });

  // Active target = first undefeated enemy in sequence (sequential levels)
  nearestEnemy = getActiveEnemy();
  const LV_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧'];

  // Draw enemies (numbered, sequential: only the active one is challengeable)
  enemyPositions.forEach((ep, idx) => {
    if(ep.defeated) return;
    const sx = ep.x*TILE+mapOffX, sy = ep.y*TILE+mapOffY;
    const isTarget = (ep===nearestEnemy);
    const locked = !isTarget; // remaining non-active enemies are locked

    // Steady ring around the active target (no flashing)
    if(isTarget){
      ctx.strokeStyle='rgba(255,215,0,0.75)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(sx+TILE/2, sy+TILE/2, 14, 0, Math.PI*2);
      ctx.stroke();
    }

    // Floating sprite (locked enemies dimmed)
    const float = Math.sin(tick*0.05+ep.x)*3;
    ctx.save();
    if(locked) ctx.globalAlpha = 0.4;
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.fillText(ep.enemy.sprite, sx+TILE/2, sy+TILE/2+float);
    ctx.restore();
    // Glow only for active
    if(isTarget){
      ctx.fillStyle='rgba(255,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(sx+TILE/2,sy+TILE-4,12,4,0,0,Math.PI*2);
      ctx.fill();
    }
    // Lock badge on locked enemies
    if(locked){
      ctx.font = '13px serif';
      ctx.fillText('🔒', sx+TILE/2+9, sy+TILE/2-8);
    }

    // Numbered name label above the enemy
    const label = LV_NUMS[idx] + ep.enemy.name;
    ctx.font = 'bold 9px "Noto Sans TC", sans-serif';
    const lw = ctx.measureText(label).width + 8;
    const lx = sx+TILE/2, ly = sy - 6;
    ctx.fillStyle = isTarget ? 'rgba(90,68,0,0.92)' : 'rgba(0,0,0,0.6)';
    ctx.fillRect(lx-lw/2, ly-10, lw, 13);
    ctx.strokeStyle = isTarget ? '#ffd700' : 'rgba(120,120,140,0.5)';
    ctx.lineWidth=1;
    ctx.strokeRect(lx-lw/2, ly-10, lw, 13);
    ctx.fillStyle = isTarget ? '#ffe680' : '#8890a0';
    ctx.fillText(label, lx, ly);
  });

  // Draw interactive props
  PROPS.forEach(pr => {
    const sx = pr.x*TILE+mapOffX, sy = pr.y*TILE+mapOffY;
    const used = propUsed.has(pr.id);
    const adjacent = Math.abs(pr.x-player.x)<=1 && Math.abs(pr.y-player.y)<=1;
    ctx.save();
    if(pr.type==='chest' && used) ctx.globalAlpha = 0.4;
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.fillText(used && pr.type==='chest' ? '📭' : pr.sprite, sx+TILE/2, sy+TILE/2);
    ctx.restore();
    // Steady interact hint only when the player is right next to it
    const interactable = !(pr.type==='chest' && used);
    if(adjacent && interactable){
      ctx.fillStyle='#ffd700';
      ctx.font='bold 13px sans-serif';
      ctx.fillText('↵', sx+TILE/2, sy-6);
    }
  });

  // Draw NPCs
  NPC_DIALOGS.forEach(npc => {
    const sx = npc.x*TILE+mapOffX, sy = npc.y*TILE+mapOffY;
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.fillText(npc.sprite, sx+TILE/2, sy+TILE/2);
    if(!npcSpoken.has(npc.id)){
      // Bounce "!" above
      const bounce = Math.sin(tick*0.08)*3;
      ctx.fillStyle='#ffcc00';
      ctx.font='bold 14px sans-serif';
      ctx.fillText('!', sx+TILE/2, sy-4+bounce);
    }
  });

  // Draw player (pixel-art hero)
  const px = player.x*TILE+mapOffX, py = player.y*TILE+mapOffY;

  // Player shadow (under feet)
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px+TILE/2,py+TILE-3,10,4,0,0,Math.PI*2);
  ctx.fill();

  // Idle breathing / walk bob
  const moving = (performance.now()-lastMoveTime) < 220;
  const frame = moving ? (player.step % 2) : 0;
  const bob = moving ? 0 : (Math.sin(tick*0.06) > 0 ? 0 : 1);
  drawHeroSprite(ctx, px, py - bob, TILE/16, player.dir, frame);

  // Guidance arrow: floats around the hero, points toward the next target
  if(nearestEnemy){
    const ang = Math.atan2(nearestEnemy.y-player.y, nearestEnemy.x-player.x);
    const cxp=px+TILE/2, cyp=py+TILE/2, rad=30;
    const ax=cxp+Math.cos(ang)*rad, ay=cyp+Math.sin(ang)*rad;
    ctx.save();
    ctx.translate(ax,ay);
    ctx.rotate(ang);
    ctx.fillStyle='rgba(255,215,0,0.9)';
    ctx.beginPath();
    ctx.moveTo(9,0); ctx.lineTo(-5,-6); ctx.lineTo(-5,6);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Draw minimap
  renderMinimap();

  // Update progress + next-target guidance
  document.getElementById('progText').textContent = `關卡進度: ${STATE.battles}/${STATE.maxBattles}`;
  const pt=document.getElementById('progTarget');
  const ptd=document.getElementById('progTargetDesc');
  if(pt && ptd){
    if(nearestEnemy){
      const lvNo = enemyPositions.indexOf(nearestEnemy)+1;
      pt.textContent = `關卡 ${lvNo}：${nearestEnemy.enemy.name}`;
      ptd.textContent = nearestEnemy.enemy.desc + '（其餘關卡上鎖中）';
    } else {
      pt.textContent = '全部關卡完成！';
      ptd.textContent = '即將結算你的命運座駕';
    }
  }
}

function renderMinimap() {
  const mc = minimapCanvas, mx = minimapCtx;
  mc.width = 80; mc.height = 80;
  const tw = 80/MAP_W, th = 80/MAP_H;
  for(let ty=0;ty<MAP_H;ty++){
    for(let tx=0;tx<MAP_W;tx++){
      mx.fillStyle = TILE_COLORS[MAP_DATA[ty][tx]];
      mx.fillRect(tx*tw,ty*th,tw,th);
    }
  }
  // Player dot
  mx.fillStyle='#fff';
  mx.fillRect(player.x*tw-1,player.y*th-1,4,4);
  // Enemies (next target steady gold)
  enemyPositions.forEach(ep=>{
    if(ep.defeated)return;
    if(ep===nearestEnemy){
      mx.fillStyle = '#ffd700';
      mx.fillRect(ep.x*tw-1,ep.y*th-1,5,5);
    } else {
      mx.fillStyle='#f44';
      mx.fillRect(ep.x*tw,ep.y*th,3,3);
    }
  });
  // Roaming mobs (orange)
  mobs.forEach(m=>{
    mx.fillStyle = m.chasing ? '#ff7a00' : '#ffae5c';
    mx.fillRect(m.x*tw, m.y*th, 3, 3);
  });
  // Teleporters (purple)
  TRAPS.forEach(tr=>{
    if(tr.type==='teleport'){ mx.fillStyle='#b07bff'; mx.fillRect(tr.x*tw, tr.y*th, 3, 3); }
  });
}

// ============================================================
// HERO SPRITE (pixel art, drawn on canvas)
// ============================================================
const HERO = {
  hair:'#4a2f17', hairLt:'#6b4423',
  skin:'#f6c79f', skinSh:'#d99c72',
  tunic:'#eb0a1e', tunicSh:'#a30012', tunicLt:'#ff5a66',
  collar:'#ffe6ad',
  belt:'#33220f', buckle:'#ffd700',
  pants:'#2b3f6b', pantsSh:'#1d2c4e',
  boots:'#241a12',
  eye:'#23203a'
};

// Returns array of pixel rects {x,y,w,h,c} on a 16x16 grid for the given
// direction. 'left' is rendered by mirroring the 'right' design.
function heroRects(dir, frame) {
  const H = HERO;
  const r = [];
  const f = frame ? 1 : 0; // walk frame 0/1

  if (dir === 'up') {
    // Back of head + body
    r.push({x:5,y:1,w:6,h:1,c:H.hair});
    r.push({x:4,y:2,w:8,h:5,c:H.hair});
    r.push({x:5,y:2,w:6,h:1,c:H.hairLt});
    // neck
    r.push({x:6,y:7,w:4,h:1,c:H.skinSh});
  } else if (dir === 'left' || dir === 'right') {
    // Profile (designed facing right; mirrored for left)
    r.push({x:5,y:1,w:5,h:1,c:H.hair});
    r.push({x:4,y:2,w:6,h:2,c:H.hair});
    r.push({x:4,y:4,w:2,h:2,c:H.hair});           // back hair
    r.push({x:6,y:4,w:4,h:3,c:H.skin});           // face
    r.push({x:10,y:5,w:1,h:1,c:H.skin});          // nose
    r.push({x:6,y:4,w:1,h:1,c:H.hair});           // fringe
    r.push({x:8,y:5,w:1,h:1,c:H.eye});            // eye
    r.push({x:7,y:6,w:2,h:1,c:H.skinSh});         // jaw shade
  } else { // down (default)
    r.push({x:5,y:1,w:6,h:1,c:H.hair});
    r.push({x:4,y:2,w:8,h:2,c:H.hair});
    r.push({x:5,y:2,w:6,h:1,c:H.hairLt});         // hair shine
    r.push({x:5,y:4,w:6,h:3,c:H.skin});           // face
    r.push({x:4,y:4,w:1,h:2,c:H.hair});           // L sideburn
    r.push({x:11,y:4,w:1,h:2,c:H.hair});          // R sideburn
    r.push({x:5,y:4,w:6,h:1,c:H.hair});           // bangs
    r.push({x:6,y:5,w:1,h:1,c:H.eye});            // L eye
    r.push({x:9,y:5,w:1,h:1,c:H.eye});            // R eye
    r.push({x:5,y:6,w:1,h:1,c:H.skinSh});         // cheek
    r.push({x:10,y:6,w:1,h:1,c:H.skinSh});        // cheek
    r.push({x:7,y:6,w:2,h:1,c:H.skinSh});         // mouth
  }

  if (dir === 'left' || dir === 'right') {
    // Body (profile) – slimmer
    r.push({x:6,y:7,w:1,h:1,c:H.skinSh});         // neck
    r.push({x:5,y:8,w:6,h:4,c:H.tunic});
    r.push({x:5,y:8,w:1,h:4,c:H.tunicSh});
    r.push({x:9,y:8,w:1,h:1,c:H.tunicLt});
    // swinging arm + hand
    const armX = f ? 9 : 6;
    r.push({x:armX,y:9,w:1,h:2,c:H.tunicSh});
    r.push({x:armX,y:11,w:1,h:1,c:H.skin});
    r.push({x:5,y:12,w:6,h:1,c:H.belt});
    r.push({x:7,y:12,w:1,h:1,c:H.buckle});
    r.push({x:6,y:13,w:5,h:2,c:H.pants});
    r.push({x:6,y:13,w:1,h:2,c:H.pantsSh});
    // legs stride
    if (f) { r.push({x:8,y:15,w:3,h:1,c:H.boots}); r.push({x:5,y:15,w:2,h:1,c:H.boots}); }
    else   { r.push({x:6,y:15,w:3,h:1,c:H.boots}); r.push({x:9,y:15,w:2,h:1,c:H.boots}); }
  } else {
    // Body (front/back)
    r.push({x:6,y:7,w:4,h:1,c:H.collar});         // collar
    r.push({x:4,y:8,w:8,h:1,c:H.tunic});          // shoulders
    r.push({x:4,y:9,w:8,h:3,c:H.tunic});          // torso
    r.push({x:4,y:8,w:1,h:4,c:H.tunicSh});        // L shade
    r.push({x:11,y:8,w:1,h:4,c:H.tunicSh});       // R shade
    r.push({x:5,y:8,w:1,h:1,c:H.tunicLt});        // highlight
    // hands at sides
    r.push({x:3,y:10,w:1,h:2,c:H.skin});
    r.push({x:12,y:10,w:1,h:2,c:H.skin});
    // belt
    r.push({x:4,y:12,w:8,h:1,c:H.belt});
    r.push({x:7,y:12,w:2,h:1,c:H.buckle});
    // pants
    r.push({x:5,y:13,w:6,h:2,c:H.pants});
    r.push({x:5,y:13,w:1,h:2,c:H.pantsSh});
    // boots with walk stride
    if (f) { r.push({x:5,y:14,w:2,h:2,c:H.boots}); r.push({x:9,y:15,w:2,h:1,c:H.boots}); }
    else   { r.push({x:5,y:15,w:2,h:1,c:H.boots}); r.push({x:9,y:14,w:2,h:2,c:H.boots}); }
  }
  return r;
}

function drawHeroSprite(c, ox, oy, P, dir, frame) {
  const rects = heroRects(dir, frame);
  const mirror = (dir === 'left');
  c.save();
  rects.forEach(rc => {
    const gx = mirror ? (16 - rc.x - rc.w) : rc.x;
    c.fillStyle = rc.c;
    c.fillRect(
      Math.round(ox + gx * P),
      Math.round(oy + rc.y * P),
      Math.ceil(rc.w * P),
      Math.ceil(rc.h * P)
    );
  });
  c.restore();
}

// ============================================================
// INPUT
// ============================================================
function handleKey(e) {
  // In battle: ↑/↓ choose an option, Enter confirms, 1~5 quick-select (full keyboard play)
  if(STATE.inBattle) {
    if(!playerTurn || !battleActionsEnabled) return;
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ e.preventDefault(); moveBattleSelection(-1); }
    else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){ e.preventDefault(); moveBattleSelection(1); }
    else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activateBattleSelection(); }
    else if(e.key>='1' && e.key<='5'){ e.preventDefault(); activateBattleOption(Number(e.key)-1); }
    return;
  }

  if(STATE.inDialog) {
    if(e.key==='Enter' || e.key===' ') advanceDialog();
    return;
  }

  let dir=null;
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') dir='up';
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') dir='down';
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') dir='left';
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') dir='right';
  else if(e.key==='Enter'||e.key===' ') { e.preventDefault(); doInteract(); return; }
  else return;

  e.preventDefault();
  tryMove(dir);
}

// Move the hero one tile in a direction. Used by keyboard AND touch controls.
function tryMove(dir) {
  if(STATE.inBattle) return;
  if(STATE.inDialog) { advanceDialog(); return; }

  // Always turn to face the chosen direction (even if blocked)
  player.dir = dir;

  let nx=player.x, ny=player.y;
  if(dir==='up') ny--;
  else if(dir==='down') ny++;
  else if(dir==='left') nx--;
  else if(dir==='right') nx++;

  // Boundary & passable check
  if(ny<0||ny>=MAP_H||nx<0||nx>=MAP_W) return;
  if(!TILE_PASSABLE[MAP_DATA[ny][nx]]) return;

  player.x=nx; player.y=ny;
  player.step=(player.step+1)%2;
  lastMoveTime=performance.now();

  // Map mechanisms (spikes / teleporters) react to the new tile first
  checkTraps();

  // Check encounters & interactions
  checkEnemyEncounter();
  checkMobEncounter();
  checkNPCProximity();
}

// Unified interact / confirm. Used by keyboard ENTER and the touch button.
function doInteract() {
  if(STATE.inBattle) return;
  if(STATE.inDialog) { advanceDialog(); return; }
  checkInteraction();
}

// First undefeated enemy in sequence = the only one currently challengeable
function getActiveEnemy() {
  for(let i=0;i<enemyPositions.length;i++){
    if(!enemyPositions[i].defeated) return enemyPositions[i];
  }
  return null;
}

function checkEnemyEncounter() {
  const active = getActiveEnemy();
  enemyPositions.forEach(ep => {
    if(ep.defeated) return;
    if(ep.x===player.x && ep.y===player.y) {
      if(ep===active) {
        startBattle(ep);
      } else {
        // Locked: must clear earlier levels first
        showNotification('🔒 尚未解鎖！請先擊敗 ' + (active ? active.enemy.name : '前面的對手'));
      }
    }
  });
}

// NPC dialogue now triggers just by walking past (adjacent), not only on the tile
function checkNPCProximity() {
  NPC_DIALOGS.forEach(npc => {
    const dx=Math.abs(npc.x-player.x), dy=Math.abs(npc.y-player.y);
    if(dx<=1 && dy<=1) {
      if(!npcSpoken.has(npc.id)){
        npcSpoken.add(npc.id);
        showDialog(npc.name, npc.lines, null);
      }
    }
  });
}

function checkInteraction() {
  // Gather every interactable (NPC or prop) the player is standing next to,
  // then act on the single closest one so ENTER never triggers two at once.
  let best=null, bestD=Infinity;
  const consider=(obj)=>{
    const dx=Math.abs(obj.x-player.x), dy=Math.abs(obj.y-player.y);
    if(dx<=1&&dy<=1){
      const d=dx+dy;
      if(d<bestD){ bestD=d; best=obj; }
    }
  };
  NPC_DIALOGS.forEach(n=>consider({...n, _kind:'npc'}));
  PROPS.forEach(p=>consider({...p, _kind:'prop'}));

  if(!best) return;
  if(best._kind==='npc'){
    showDialog(best.name, best.lines, null);
  } else {
    interactProp(best);
  }
}

// Handle interacting with a prop based on its type
function interactProp(pr){
  if(pr.type==='sign' || pr.type==='villager'){
    showDialog(pr.name, pr.lines, null);
  } else if(pr.type==='fountain'){
    STATE.player.hp = STATE.player.maxHp;
    STATE.player.sp = STATE.player.maxSp;
    updateHUD();
    showDialog(pr.name, [pr.msg], null);
  } else if(pr.type==='chest'){
    if(propUsed.has(pr.id)){
      showDialog(pr.name, ['這個寶箱已經空空如也了。'], null);
      return;
    }
    propUsed.add(pr.id);
    STATE.stats.chests++;
    const rw = pr.reward || {};
    if(rw.exp) STATE.player.exp += rw.exp;
    if(rw.hp){ STATE.player.hp = Math.min(STATE.player.maxHp, STATE.player.hp+rw.hp); }
    if(rw.sp){ STATE.player.sp = Math.min(STATE.player.maxSp, STATE.player.sp+rw.sp); }
    // 寶箱為中性獎勵：不加任何車款分數，不影響最終判斷
    updateHUD();
    showNotification('🎁 開啟寶箱！');
    showDialog(pr.name, [pr.msg], null);
  }
}

// ============================================================
// TOUCH CONTROLS (mobile)
// ============================================================
function setupTouchControls() {
  // Detect touch-capable device and reveal on-screen controls
  const isTouch = ('ontouchstart' in window) ||
                  (navigator.maxTouchPoints > 0) ||
                  window.matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');

  // D-pad buttons: tap to step, hold to repeat
  document.querySelectorAll('.dbtn').forEach(btn => {
    const dir = btn.dataset.dir;
    let repeat = null;
    const press = (ev) => {
      ev.preventDefault();
      tryMove(dir);
      clearInterval(repeat);
      repeat = setInterval(() => tryMove(dir), 170);
    };
    const release = (ev) => { if(ev) ev.preventDefault(); clearInterval(repeat); repeat=null; };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // Interact / confirm button
  const ib = document.getElementById('btnInteract');
  if (ib) {
    ib.addEventListener('pointerdown', (e) => { e.preventDefault(); doInteract(); });
    ib.addEventListener('contextmenu', e => e.preventDefault());
  }

  // Tapping the dialog box advances it (mobile-friendly)
  const dbox = document.getElementById('dialogBox');
  if (dbox) dbox.addEventListener('pointerdown', (e) => {
    if (STATE.inDialog) { e.preventDefault(); advanceDialog(); }
  });

  // Block pinch / double-tap zoom and rubber-band scroll inside the game
  document.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
}

// DIALOG SYSTEM
// ============================================================
let dialogLines = [];
let dialogIdx = 0;
let dialogTyping = false;
let typeInterval = null;

function showDialog(speaker, lines, callback) {
  STATE.inDialog = true;
  dialogLines = lines;
  dialogIdx = 0;
  STATE.dialogCallback = callback;

  const box = document.getElementById('dialogBox');
  box.style.display = 'block';
  document.getElementById('dialogSpeaker').textContent = speaker ? `▶ ${speaker}` : '';
  document.getElementById('dialogChoices').style.display = 'none';
  document.getElementById('dialogNext').style.display = 'block';

  typeLine(dialogLines[0]);
}

function typeLine(text) {
  const el = document.getElementById('dialogText');
  el.textContent = '';
  dialogTyping = true;
  let i=0;
  clearInterval(typeInterval);
  typeInterval = setInterval(() => {
    if(i>=text.length){
      clearInterval(typeInterval);
      dialogTyping=false;
    } else {
      el.textContent += text[i++];
    }
  }, 28);
}

function advanceDialog() {
  if(dialogTyping){
    // Skip typing
    clearInterval(typeInterval);
    dialogTyping=false;
    document.getElementById('dialogText').textContent = dialogLines[dialogIdx];
    return;
  }
  dialogIdx++;
  if(dialogIdx < dialogLines.length){
    typeLine(dialogLines[dialogIdx]);
  } else {
    closeDialog();
  }
}

function closeDialog() {
  STATE.inDialog = false;
  document.getElementById('dialogBox').style.display = 'none';
  if(STATE.dialogCallback) STATE.dialogCallback();
}

// ============================================================
// BATTLE SYSTEM
// ============================================================
let battleEnemy = null;
let playerTurn = true;
let battleActionsEnabled = true;
let battleHeroFrame = 0;
let battleHeroTimer = null;
let battleTurns = 0;
let lastQ = -1;
let curQuestion = null, curAnswerDmg = 0, curUltDmg = 0;
let selectedOpt = 0;
const ULT_SP = 12;

function drawBattleHero() {
  const cv = document.getElementById('battleHeroCanvas');
  if (!cv) return;
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  // Hero faces left toward the enemy; gentle idle step animation
  drawHeroSprite(c, 0, 0, cv.width / 16, 'left', battleHeroFrame);
}

// Shared battle setup for both story enemies and roaming mobs
function beginBattle(enemyData, isMob){
  STATE.inBattle = true;
  currentBattleIsMob = isMob;
  battleEnemy = {...enemyData, maxHp: enemyData.hp, currentHp: enemyData.hp};

  const bs = document.getElementById('battleScreen');
  bs.style.display = 'flex';
  document.getElementById('enemyName').textContent = battleEnemy.name;
  document.getElementById('enemySprite').textContent = battleEnemy.sprite;
  updateEnemyHp();

  const tag = isMob ? '🐾 野生的' : '⚔️';
  const log = document.getElementById('battleLog');
  log.innerHTML = `<div class="battle-log-line log-system">${tag} ${battleEnemy.name} 出現了！</div>
<div class="battle-log-line log-system" style="color:#aaa;font-size:11px">"${battleEnemy.dialogue}"</div>`;

  battleTurns = 0;
  lastQ = -1;
  updateHUD();

  // Start hero idle animation
  battleHeroFrame = 0;
  drawBattleHero();
  clearInterval(battleHeroTimer);
  battleHeroTimer = setInterval(() => {
    battleHeroFrame = battleHeroFrame ? 0 : 1;
    drawBattleHero();
  }, 450);

  // First player turn = a question
  startPlayerTurn();
}

// Story enemy (sequential level)
function startBattle(ep) {
  if(STATE.battles >= STATE.maxBattles) return;
  STATE.battles++;
  ep.defeated = true; // Remove from map
  beginBattle(ep.enemy, false);
}

// Roaming mob — does NOT count toward the 5 levels and does NOT affect the result
function startMobBattle(mob){
  if(STATE.inBattle) return;
  mobs = mobs.filter(m=>m!==mob);   // consume the mob
  beginBattle({ name:mob.type.name, sprite:mob.type.sprite, hp:mob.type.hp,
                atk:mob.type.atk, dialogue:mob.type.dialogue, scores:{} }, true);
}

// ---- Quiz-based combat: each turn poses a question ----
function startPlayerTurn(){
  playerTurn = true;
  battleActionsEnabled = true;
  presentQuestion();
}

// Shuffled "deck" so questions never repeat until the whole pool has been used
let questionDeck = [];
function refillQuestionDeck(){
  questionDeck = QUESTIONS.map((_, i) => i);
  for(let i=questionDeck.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [questionDeck[i], questionDeck[j]] = [questionDeck[j], questionDeck[i]];
  }
  // avoid an immediate repeat across the reshuffle seam
  if(questionDeck.length>1 && questionDeck[questionDeck.length-1]===lastQ){
    [questionDeck[questionDeck.length-1], questionDeck[0]] =
      [questionDeck[0], questionDeck[questionDeck.length-1]];
  }
}
function pickQuestion(){
  if(questionDeck.length===0) refillQuestionDeck();
  const idx = questionDeck.pop();
  lastQ = idx;
  return QUESTIONS[idx];
}

function presentQuestion(){
  curQuestion = pickQuestion();
  // All three answers share the SAME attack power this turn (so you answer honestly);
  // the「我不知道」ultimate hits harder but reveals nothing about you.
  curAnswerDmg = 16 + Math.floor(Math.random()*6);
  curUltDmg = curAnswerDmg + 12 + Math.floor(Math.random()*7);

  document.getElementById('battleQuestion').innerHTML =
    '❓ ' + curQuestion.q + '<div style="color:#8890a8;font-size:10px;margin-top:3px">三個選項攻擊力相同，憑直覺選；或用大招跳過</div>';

  const opts = document.getElementById('battleOptions');
  opts.innerHTML = '';
  curQuestion.a.forEach((ans, idx)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.innerHTML = `<span class="opt-key">${idx+1}</span>${ans.t}`;
    b.onclick = ()=>chooseAnswer(idx);
    opts.appendChild(b);
  });
  const u = document.createElement('button');
  u.className = 'opt-btn ult-opt';
  u.innerHTML = `<span class="opt-key">4</span>🤔 「我不知道！」大招 · SP ${ULT_SP}`;
  u.disabled = STATE.player.sp < ULT_SP;
  u.onclick = ()=>useUltimate();
  opts.appendChild(u);

  updateItemButton();
  selectedOpt = 0;
  highlightBattle();
}

// ---- Keyboard selection of battle options (desktop = full keyboard) ----
function battleButtons(){
  const arr = [...document.querySelectorAll('#battleOptions .opt-btn')];
  const item = document.getElementById('btnItem');
  if(item) arr.push(item);
  return arr;
}
function enabledBattleButtons(){ return battleButtons().filter(b=>!b.disabled); }
function highlightBattle(){
  battleButtons().forEach(b=>b.classList.remove('selected'));
  const en = enabledBattleButtons();
  if(!en.length) return;
  if(selectedOpt<0) selectedOpt=0;
  if(selectedOpt>=en.length) selectedOpt=en.length-1;
  en[selectedOpt].classList.add('selected');
}
function moveBattleSelection(dir){
  const en = enabledBattleButtons();
  if(!en.length) return;
  selectedOpt = (selectedOpt + dir + en.length) % en.length;
  highlightBattle();
  en[selectedOpt].scrollIntoView({block:'nearest'});
}
function activateBattleSelection(){
  const en = enabledBattleButtons();
  if(en[selectedOpt]) en[selectedOpt].click();
}
function activateBattleOption(i){   // number keys: 0..2 answers, 3 ult, 4 item
  const opts = [...document.querySelectorAll('#battleOptions .opt-btn')];
  const target = (i < opts.length) ? opts[i] : document.getElementById('btnItem');
  if(target && !target.disabled) target.click();
}

function updateItemButton(){
  const ib = document.getElementById('btnItem');
  if(!ib) return;
  ib.textContent = `🧪 使用道具 (x${STATE.items})`;
  ib.disabled = STATE.items<=0 || !battleActionsEnabled || !playerTurn;
}

function lockActions(){
  battleActionsEnabled = false;
  document.querySelectorAll('#battleOptions .opt-btn').forEach(b=>b.disabled=true);
  const ib=document.getElementById('btnItem'); if(ib) ib.disabled=true;
}

function rollCrit(base, chance){
  if(Math.random()<chance){
    if(!currentBattleIsMob) STATE.stats.crits++;
    return { dmg: Math.round(base*1.6), crit:true };
  }
  return { dmg: base, crit:false };
}

function chooseAnswer(idx){
  if(!battleActionsEnabled || !playerTurn) return;
  lockActions();
  const ans = curQuestion.a[idx];
  // Personality signal is recorded ONLY in story battles
  if(!currentBattleIsMob){
    STATE.stats.answers++;
    for(const k in ans.sc){
      STATE.scores[k]=(STATE.scores[k]||0)+ans.sc[k];
      STATE.answerTally[k]=(STATE.answerTally[k]||0)+1;
    }
  }
  const r = rollCrit(curAnswerDmg, 0.15);
  resolvePlayerMove(r.dmg, `🗣️ 你選擇「${ans.t}」` + (r.crit?'　<b style="color:#ffd54a">暴擊！</b>':''));
}

function useUltimate(){
  if(!battleActionsEnabled || !playerTurn) return;
  if(STATE.player.sp < ULT_SP) return;
  lockActions();
  STATE.player.sp -= ULT_SP;
  if(!currentBattleIsMob) STATE.stats.ults++;
  const r = rollCrit(curUltDmg, 0.2);
  resolvePlayerMove(r.dmg, `🤔 你大喊「我不知道！」轟出大招` + (r.crit?'　<b style="color:#ffd54a">暴擊！</b>':''));
}

function useItem(){
  if(!battleActionsEnabled || !playerTurn || STATE.items<=0) return;
  lockActions();
  STATE.items--;
  if(!currentBattleIsMob) STATE.stats.itemsUsed++;
  const heal=35, sp=12;
  STATE.player.hp=Math.min(STATE.player.maxHp, STATE.player.hp+heal);
  STATE.player.sp=Math.min(STATE.player.maxSp, STATE.player.sp+sp);
  updateHUD();
  addLog(`🧪 使用道具，回復 ${heal} HP / ${sp} SP！（剩 ${STATE.items} 個）`,'log-player');
  battleTurns++;
  setTimeout(()=>{ if(STATE.player.hp<=0) battleDefeat(); else enemyTurn(); }, 650);
}

function resolvePlayerMove(dmg, msg){
  battleTurns++;
  STATE.stats.turns++;
  if(!currentBattleIsMob) STATE.stats.dmgDealt += dmg;
  battleEnemy.currentHp = Math.max(0, battleEnemy.currentHp - dmg);
  updateEnemyHp();
  addLog(msg + `，造成 <b style="color:#ffd">${dmg}</b> 點傷害！`, 'log-player');
  updateHUD();
  const es = document.getElementById('enemySprite');
  es.style.animation='none';
  setTimeout(()=>{es.style.animation='enemyHit 0.4s ease, enemyFloat 2s ease-in-out 0.4s infinite';},10);
  setTimeout(()=>{
    if(battleEnemy.currentHp<=0) battleVictory();
    else enemyTurn();
  }, 700);
}

function enemyTurn() {
  let mult=1, prefix='💥 '+battleEnemy.name+' 攻擊！';
  // Story bosses occasionally unleash a signature move (telegraphed, harder hit)
  if(!currentBattleIsMob && battleEnemy.sig && Math.random()<0.28){
    mult = battleEnemy.sigMul || 1.5;
    prefix = battleEnemy.sig;
  }
  const base = battleEnemy.atk + Math.floor(Math.random()*8) - 3;
  const finalDmg = Math.max(2, Math.round(base*mult));
  STATE.player.hp=Math.max(0,STATE.player.hp-finalDmg);
  if(!currentBattleIsMob) STATE.stats.dmgTaken += finalDmg;
  addLog(`${prefix}勇者受到 <b style="color:#f88">${finalDmg}</b> 點傷害！`, 'log-enemy');
  updateHUD();
  if(mult>1){
    const ha=document.getElementById('battleHeroCanvas');
    if(ha){ ha.style.animation='none'; void ha.offsetWidth; ha.style.animation='playerHit 0.4s'; }
  }
  setTimeout(()=>{
    if(STATE.player.hp<=0) battleDefeat();
    else startPlayerTurn();
  },650);
}

function battleVictory() {
  // Roaming mob: EXP + small heal only. No scores, no level count, no result trigger.
  if(currentBattleIsMob){
    STATE.stats.mobs++;
    const expGain=8+Math.floor(Math.random()*8);
    STATE.player.exp+=expGain;
    STATE.player.hp=Math.min(STATE.player.maxHp,STATE.player.hp+10);
    STATE.player.sp=Math.min(STATE.player.maxSp,STATE.player.sp+6);
    addLog(`🎉 擊退了 ${battleEnemy.name}！獲得 ${expGain} EXP`,'log-system');
    setTimeout(()=>{ closeBattle(); showNotification(`擊退小怪！+${expGain} EXP`); },1000);
    return;
  }

  STATE.battlesWon++;
  if(battleTurns<=3) STATE.stats.fastWins++;                              // 速戰速決
  if(STATE.player.hp/STATE.player.maxHp < 0.3) STATE.stats.lowHpWins++;   // 險中求勝
  STATE.items = Math.min(5, STATE.items+1);                              // 補一個道具
  const expGain=20+STATE.battles*5;
  STATE.player.exp+=expGain;
  // Level up check
  if(STATE.player.exp>=STATE.player.lv*50){
    STATE.player.lv++;
    STATE.player.maxHp+=10;
    STATE.player.maxSp+=5;
    STATE.player.hp=STATE.player.maxHp;
    STATE.player.sp=STATE.player.maxSp;
    showNotification(`⬆️ 升等！LV ${STATE.player.lv}`);
  } else {
    // Partial recover
    STATE.player.hp=Math.min(STATE.player.maxHp,STATE.player.hp+20);
    STATE.player.sp=Math.min(STATE.player.maxSp,STATE.player.sp+10);
  }
  addLog(`🎉 勝利！獲得 ${expGain} EXP！`,'log-system');

  setTimeout(()=>{
    closeBattle();
    if(STATE.battles>=STATE.maxBattles){
      setTimeout(showResult, 800);
    } else {
      showNotification(`勝利！還有 ${STATE.maxBattles-STATE.battles} 場冒險等著你！`);
    }
  },1200);
}

function battleDefeat() {
  if(!currentBattleIsMob) STATE.battlesLost++;  // mob losses don't affect the result
  STATE.player.hp=30;
  addLog('💀 勇者倒下了... 但意志未滅！復活！','log-system');
  setTimeout(()=>{
    closeBattle();
    showNotification('雖然敗北，但你學到了寶貴的一課！');
  },1500);
}

function closeBattle() {
  STATE.inBattle=false;
  clearInterval(battleHeroTimer);
  battleHeroTimer=null;
  document.getElementById('battleScreen').style.display='none';
  updateHUD();
}

function updateEnemyHp() {

function addLog(html,cls=''){
  const log=document.getElementById('battleLog');
  const div=document.createElement('div');
  div.className='battle-log-line '+(cls||'');

function updateHUD(){

  document.getElementById('hudHpBar').style.width=(p.hp/p.maxHp*100)+'%';

function computeFinalScores(){
  const s = {yaris:0,corolla:0,rav4:0,alphard:0,prius:0};
  for(const k in s) s[k] += STATE.scores[k]||0;   // answers are the main signal
  const st = STATE.stats;
  // Subtle play-style bonuses (still far smaller than the answer signal)
  if(st.lowHpWins>=2) s.rav4 += 3;                       // 險中求勝 → 全能冒險
  if(st.fastWins>=3){ s.yaris += 2; s.corolla += 2; }    // 速戰速決 → 俐落/理性
  if(st.itemsUsed>=3){ s.alphard += 2; s.prius += 1; }   // 善於準備 → 顧家/務實
  if(st.ults>=5) s.yaris += 2;                           // 常用大招、果斷
  if(st.crits>=4) s.rav4 += 1;                           // 火力旺盛
  if(STATE.battlesLost===0) s.corolla += 1;              // 零失誤、沉穩
  return s;
}

function computeGrade(){
  const st=STATE.stats;
  let pts = STATE.battlesWon*2 - STATE.battlesLost + st.fastWins + (st.mobs>=3?1:0) + (st.lowHpWins?1:0);
  if(STATE.battlesLost===0 && st.fastWins>=3) return 'S';
  if(pts>=11) return 'A';
  if(pts>=8) return 'B';
  return 'C';
}

// ---- canvas helpers ----
function rrPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); }
function wrapText(ctx,text,x,y,maxW,lh){ const chars=[...text]; let line='',yy=y; for(const ch of chars){ const test=line+ch; if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,yy); line=ch; yy+=lh; } else line=test; } if(line) ctx.fillText(line,x,yy); return yy; }

function drawPixelCar(ctx,cx,cy,color){
  const O='#10180f', dark=shade(color,-45), win='#bfe6f2';
  const r=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(Math.round(cx+x),Math.round(cy+y),w,h); };
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(cx,cy+44,94,12,0,0,Math.PI*2); ctx.fill();
  r(-60,-46,120,30,O);                 // cabin outline
  r(-54,-42,108,24,color);             // cabin
  r(-48,-38,44,16,win); r(4,-38,44,16,win); r(-4,-38,4,16,O);  // windows
  r(-96,-18,192,52,O);                 // body outline
  r(-92,-14,184,44,color);             // body
  r(-92,18,184,12,dark);               // body shade
  r(86,-6,10,12,'#ffe24a');            // headlight
  r(-96,-6,8,12,'#ff6a6a');            // taillight
  r(-98,28,14,8,'#cfd6da'); r(84,28,14,8,'#cfd6da'); // bumpers
  const wheel=(wx)=>{ r(wx-20,28,40,20,O); r(wx-15,32,30,16,'#26262b'); r(wx-6,37,12,8,'#838893'); };
  wheel(-50); wheel(58);
}

function shareCard(){
  const cv=document.getElementById('shareCanvas');
  const copy=document.getElementById('shareCopy').textContent;

function showResult(){
  const scores = computeFinalScores();
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const topCar = sorted[0][0];
  const info = CAR_INFO[topCar];
  // 契合度：用「冠軍 vs 第二名」的差距換算，越果斷越高(約 60~96)
  const top = sorted[0][1], second = sorted[1] ? sorted[1][1] : 0;
  const matchPct = Math.max(60, Math.min(96, Math.round((top/((top+second)||1))*100)));

  document.getElementById('shareCopy').textContent = info.share;
  document.getElementById('ctaBtn').href = PROMO_URL;

  document.getElementById('resultScreen').style.display='flex';
  renderShareCard(topCar, matchPct, sorted);
}
